name: v3.13 - inspect public Swiss vacancy portal data interfaces
on:
  push:
    branches: ["fix/v3-13-targeted-employer-source-health"]
    paths: [".github/workflows/v3_13_swiss_public_interfaces.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Identify documented public frontend vacancy queries, not security bypasses
        run: |
          python - <<'PY'
          import asyncio,json,re
          from job_radar.http import Http
          targets={
            "Schaffhausen_JS":"https://jobs.shkb.ch/assets/index.js",
            "Schaffhausen_components":"https://jobs.shkb.ch/custom-elements.js",
            "SPS_JS":"https://app.jobportal.abaservices.ch/assets/index.js",
            "SPS_components":"https://app.jobportal.abaservices.ch/custom-elements.js",
            "BEKB_Prospective":"https://ohws.prospective.ch/careercenter/1509/static/bundle.js",
          }
          expressions=[
            r'https?://[^\s\x22\x27<>]{12,180}',
            r'(?i).{0,65}(?:jobportal|jobs/|job-offers|vacancies|api/v[0-9]|graphql|api/jobs|joboverview|job-overview|requisitions).{0,120}'
          ]
          async def main():
            h=Http(concurrency=5,timeout=16)
            async def one(name,url):
              try:
                r=await h.get(url)
                body=r.text
                print("BUNDLE",json.dumps({"name":name,"status":r.status_code,"bytes":len(r.content),
                   "content_type":r.headers.get("content-type",""),"final":str(r.url)}),flush=True)
                for i,pat in enumerate(expressions):
                  matches=re.findall(pat,body)
                  clean=[]
                  for m in matches:
                    m=re.sub(r'\s+',' ',m)
                    if i==0 and any(z in m for z in (".js",".css",".svg",".woff","fonts","google","w3.org","cloudflare")):continue
                    if m not in clean:clean.append(m[:225])
                  print("BUNDLE_MATCHES",json.dumps({"name":name,"pattern":i,"total":len(clean),
                    "samples":clean[:35]},ensure_ascii=False),flush=True)
              except Exception as e:
                print("BUNDLE_FAIL",json.dumps({"name":name,"error":str(e)[:180]}),flush=True)
            await asyncio.gather(*(one(n,u) for n,u in targets.items()))
            await h.close()
          asyncio.run(main())
          PY
