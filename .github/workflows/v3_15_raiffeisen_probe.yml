name: v3.15 - probe Raiffeisen Switzerland first-party vacancies
on:
  push:
    branches: ["fix/v3-15-public-recruitment-portals"]
    paths: [".github/workflows/v3_15_raiffeisen_probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Distinguish job-level public records from navigation and application pages
        run: |
          python - <<'PY'
          import asyncio,json
          from bs4 import BeautifulSoup
          from job_radar.http import Http
          from job_radar.sources.generic import fetch_generic
          from job_radar.discovery import generic_job_links
          URL="https://jobs.raiffeisen.ch/"
          async def main():
            h=Http(concurrency=4,timeout=17)
            try:
              jobs,ats,final=await asyncio.wait_for(fetch_generic(h,{
                "name":"Raiffeisen Switzerland","sector":"Banca","careers_url":URL
              }),timeout=75)
              print("RAIFFEISEN_PROBE",json.dumps({"count":len(jobs),"sample":[{"title":j.title,
                "url":j.apply_url,"posted":j.posted_at} for j in jobs[:12]],
                "ats":ats,"final":final},ensure_ascii=False),flush=True)
              r=await h.get(URL)
              soup=BeautifulSoup(r.text,"html.parser")
              links=generic_job_links(r.text,str(r.url))
              print("RAIFFEISEN_HTTP",json.dumps({"status":r.status_code,"bytes":len(r.content),
                "links":len(links),"samples":links[:12],"title":soup.title.get_text(" ",strip=True) if soup.title else ""},
                ensure_ascii=False),flush=True)
            except Exception as e:print("RAIFFEISEN_ERROR",str(e)[:240],flush=True)
            finally:await h.close()
          asyncio.run(main())
          PY
