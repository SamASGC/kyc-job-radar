name: Radar v3.1 — updated 400 financial sources check

on:
  push:
    branches: ["feat/v3-1-swiss-banks-400"]
    paths: [".github/workflows/v3_1_verified_400_smoke.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Scan employer sources only in isolated workspace
        run: python radar.py scan
      - name: Assert direct and ATS counts, audit alternatives and seen history
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          sources=json.loads(Path("public/sources.json").read_text())
          state=json.loads(Path("data/state.json").read_text())
          audit=json.loads(Path("data/quality_audit.json").read_text())
          assert sources["direct_configured"]==400
          assert sources["ats_explicit"]>=144
          assert len(state["seen"])>=305
          names=("Jane Street","Point72","DRW Trading","Optiver",
              "Banque Cantonale du Jura","BGL BNP Paribas","Helvetia Group",
              "Quintet Private Bank","Swiss Re")
          by_name={x["company"]:x for x in sources["sources"]}
          assert all(n in by_name for n in names)
          print("IMPORTANT_SOURCE_HEALTH",json.dumps({
              n:{"status":by_name[n]["result"],"jobs":by_name[n]["jobs_found"]}
              for n in names},ensure_ascii=False))
          print("COVERAGE",json.dumps({k:sources[k] for k in (
              "direct_configured","ats_explicit","reached","errors","with_jobs")}))
          print("QUALITY",json.dumps({"raw":audit["raw_total"],
              "confirmed_apply":audit["official_apply_page_verified"],
              "missing_date":audit["original_date_missing"],
              "seen":len(state["seen"])}))
          PY
