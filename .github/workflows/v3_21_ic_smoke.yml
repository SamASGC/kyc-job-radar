name: v3.21 - reject managerial false positives and preserve lifetime dedup
on:
  push:
    branches: ["fix/v3-21-hard-exclude-people-management"]
    paths: [".github/workflows/v3_21_ic_smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile, run all historical and managerial regression tests
        run: |
          python -m compileall -q radar.py job_radar tests
          python -m unittest discover -s tests -v
      - name: Run isolated real 500 employer scan with revised suitability gates
        run: python radar.py scan
      - name: Verify false positive is removed but lifetime dedup remains
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source=json.loads(Path("public/sources.json").read_text(encoding="utf-8"))
          state=json.loads(Path("data/state.json").read_text(encoding="utf-8"))
          seen=list(state["seen"].values())
          visible=list(state["jobs"].values())
          print("V321_COVERAGE",json.dumps({k:source[k] for k in (
            "direct_configured","direct_with_records","direct_errors",
            "direct_reachable_zero","ats_explicit")}))
          print("V321_JOB_TITLES",[(x.get("company"),x.get("title")) for x in visible])
          print("V321_SEEN",len(seen))
          assert source["direct_configured"]==500
          assert source["ats_explicit"]==184
          assert len(seen)>=307
          assert any(x.get("company")=="Alter Domus" and
              x.get("title")=="AML/KYC Associate Manager" for x in seen), "Keep the already-seen role!"
          assert all(not (x.get("company")=="Alter Domus" and
              x.get("title")=="AML/KYC Associate Manager") for x in visible), "Management role must be retracted"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-21-management-filter-source-audit
          path: |
            public/sources.json
            data/quality_audit.json
          if-no-files-found: warn
