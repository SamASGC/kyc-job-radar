name: Radar v2.9 — EFG official Oracle probe

on:
  push:
    branches: ["feat/v2-9-switzerland-luxembourg-350"]
    paths: [".github/workflows/v2_9_efg_oracle_probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Read-only official Oracle job listing probe
        run: |
          python - <<'PY'
          import asyncio,json
          from job_radar.http import Http
          from job_radar.sources.oracle_hcm import fetch_oracle_hcm
          origin="https://fa-eqai-saasfaprod1.fa.ocs.oraclecloud.com"
          endpoint=origin+"/hcmRestApi/resources/11.13.18.05/recruitingCEJobRequisitions"
          async def main():
            http=Http(concurrency=2,timeout=16)
            try:
              for site in ("CX_1001","CX_1"):
                r=await http.get(endpoint,params={
                  "finder":f"findReqs;siteNumber={site},limit=20,offset=0",
                  "expand":"requisitionList","onlyData":"true"
                },headers={"Accept":"application/json"})
                result={"site":site,"http":r.status_code,
                        "type":r.headers.get("content-type",""),
                        "bytes":len(r.text)}
                try:
                  data=r.json()
                  result["keys"]=list(data)[:8] if isinstance(data,dict) else []
                  result["item_count"]=len(data.get("items",[])) if isinstance(data,dict) else 0
                except Exception:
                  result["error_class"]="non_json"
                print("EFG_ORACLE_PROBE",json.dumps(result))
                if r.status_code == 200:
                  try:
                    jobs=await fetch_oracle_hcm(http,{
                      "name":"EFG International","sector":"Banca",
                      "careers_url":origin+"/hcmUI/CandidateExperience/en/sites/"+site
                    },{
                      "kind":"oracle_hcm",
                      "url":origin+"/hcmUI/CandidateExperience/en/sites/"+site,
                      "site":site,"language":"en"
                    })
                    print("EFG_ORACLE_JOBS",json.dumps({
                      "site":site,"count":len(jobs),
                      "sample_titles":[x.title for x in jobs[:4]]
                    }))
                  except Exception as exc:
                    print("EFG_ORACLE_JOBS",json.dumps({
                      "site":site,"error":type(exc).__name__,"detail":str(exc)[:140]
                    }))
            finally:
              await http.close()
          asyncio.run(main())
          PY
