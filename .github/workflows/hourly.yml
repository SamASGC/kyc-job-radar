name: Hourly KYC job radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: kyc-job-radar-hourly
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Scan jobs and rebuild dashboard
        run: python radar.py scan

      - name: Commit meaningful dataset changes
        shell: bash
        run: |
          git config user.name "kyc-radar-bot"
          git config user.email "kyc-radar-bot@users.noreply.github.com"

          git add data/state.json public/index.html

          if git diff --cached --quiet; then
            echo "No dataset changes."
          else
            git add data/health.json
            git commit -m "radar: refresh jobs [skip ci]"
            git push
          fi

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v5
