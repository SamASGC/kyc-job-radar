name: Hourly KYC job radar

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/hourly.yml"
  schedule:
    # v3.15: 500 employers, 179 ATS; verified Worldpay Workday, LemFi Ashby, dLocal Lever, VP Bank Umantis with first-party dates; strict 96h and lifetime dedup unchanged.
    # Two half-hour sweeps cover every registry firm with a usable website
    # once per hour, while core employer ATS feeds are checked twice/hour.
    # GitHub-hosted cron may be delayed; status.html shows last actual run.
    - cron: "17 * * * *"
    - cron: "47 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: kyc-job-radar-hourly
  # Do not cancel a finishing scan just because the next cron or manual run starts.
  # Runs stay serialized; newer events wait instead of wiping a Pages deployment.
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Scan jobs and rebuild dashboard
        run: python radar.py scan
        env:
          JOB_OPPORTUNITIES_API_KEY: ${{ secrets.JOB_OPPORTUNITIES_API_KEY }}

      - name: Commit meaningful dataset changes
        shell: bash
        run: |
          git config user.name "kyc-radar-bot"
          git config user.email "kyc-radar-bot@users.noreply.github.com"

          # health.json is per-run telemetry and changes on every scan.
          # It must not enter commits: concurrent refreshes otherwise
          # conflict on rebase even if the canonical jobs have not changed.
          git restore -- data/health.json
          git add data/state.json public/index.html public/feed.xml

          if git diff --cached --quiet; then
            echo "No dataset changes."
          else
            git commit -m "radar: refresh jobs [skip ci]"
            # Another authorised edit may land in main during this scan.
            # Preserve both commits; never force-push or discard verified state.
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v5
