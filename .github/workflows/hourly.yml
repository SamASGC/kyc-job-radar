name: Hourly KYC job radar

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/hourly.yml"
  schedule:
    # v2.5 verified: 250 direct sources and localized Workday targets release check.
    # Two half-hour sweeps cover every registry firm with a usable website
    # once per hour, while core employer ATS feeds are checked twice/hour.
    # GitHub-hosted cron may be delayed; status.html shows last actual run.
    - cron: "17 * * * *"
    - cron: "47 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: kyc-job-radar-hourly
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Scan jobs and rebuild dashboard
        run: python radar.py scan
        env:
          JOB_OPPORTUNITIES_API_KEY: ${{ secrets.JOB_OPPORTUNITIES_API_KEY }}

      - name: Commit meaningful dataset changes
        shell: bash
        run: |
          git config user.name "kyc-radar-bot"
          git config user.email "kyc-radar-bot@users.noreply.github.com"

          git add data/state.json public/index.html public/feed.xml

          if git diff --cached --quiet; then
            echo "No dataset changes."
          else
            git add data/health.json
            git commit -m "radar: refresh jobs [skip ci]"
            # Another authorised edit may land in main during this scan.
            # Preserve both commits; never force-push or discard verified state.
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v5
