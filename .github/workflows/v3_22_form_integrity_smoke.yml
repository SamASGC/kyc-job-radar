name: v3.22 - applicant form integrity and full live radar scan
on:
  push:
    branches: ["fix/v3-22-strict-applicant-form-evidence"]
    paths:
      - ".github/workflows/v3_22_form_integrity_smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile and run all historical tests
        run: |
          python -m compileall -q radar.py job_radar tests
          python -m unittest discover -s tests -v
      - name: Isolated scan against real configured employer sources
        run: python radar.py scan
      - name: Assert no employer expansion or policy relaxation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          source=json.loads(Path("public/sources.json").read_text(encoding="utf-8"))
          state=json.loads(Path("data/state.json").read_text(encoding="utf-8"))
          profile=yaml.safe_load(Path("config/profile.yaml").read_text(encoding="utf-8"))
          status=json.loads(Path("public/status.json").read_text(encoding="utf-8"))
          print("V322_COVERAGE",json.dumps({k:source[k] for k in (
              "direct_configured","direct_with_records","direct_errors",
              "direct_reachable_zero","direct_not_checked","ats_explicit")}))
          print("V322_STATUS",json.dumps(status))
          assert source["direct_configured"]==500
          assert source["ats_explicit"]==184
          assert len(state["seen"])>=307
          assert profile["strict_quality_gate"] is True
          assert profile["max_post_age_hours"]==96
          assert profile["exclude_management_roles"] is True
          assert profile["remote_scope"]=="Spain"
          assert status["active_verified_jobs"]==len(state["jobs"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-22-official-application-source-audit
          path: |
            public/status.json
            public/sources.json
            data/quality_audit.json
          if-no-files-found: warn
