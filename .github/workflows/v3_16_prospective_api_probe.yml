name: v3.16 - first-party Prospective Swiss bank public jobs APIs
on:
  push:
    branches: ["fix/v3-16-raiffeisen-public-jobs"]
    paths: [".github/workflows/v3_16_prospective_api_probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Verify public vacancy JSON endpoints used by official banking sites
        run: |
          python - <<'PY'
          import asyncio,json
          from job_radar.http import Http
          targets={
            "Raiffeisen jobs":"https://ohws.prospective.ch/public/v1/medium/1950/jobs",
            "Raiffeisen de":"https://ohws.prospective.ch/public/v1/medium/1950/jobs?lang=de",
            "Raiffeisen extended":"https://ohws.prospective.ch/public/v1/medium/1950/jobs?lang=de&size=25",
            "BEKB jobs":"https://ohws.prospective.ch/public/v1/medium/1509/jobs",
            "BEKB lang":"https://ohws.prospective.ch/public/v1/medium/1509/jobs?lang=de",
          }
          async def main():
            http=Http(concurrency=4,timeout=18)
            async def one(name,url):
              try:
                r=await http.get(url)
                item={"name":name,"status":r.status_code,"bytes":len(r.content),
                  "content_type":r.headers.get("content-type"),"final":str(r.url)}
                if "json" in (r.headers.get("content-type") or ""):
                  data=r.json()
                  item["shape"]=type(data).__name__
                  item["keys"]=list(data)[:18] if isinstance(data,dict) else []
                  item["preview"]=str(data)[:850]
                else:item["preview"]=r.text[:300]
                print("PROSPECTIVE_API",json.dumps(item,ensure_ascii=False),flush=True)
              except Exception as e:print("PROSPECTIVE_API",json.dumps({"name":name,
                  "error":type(e).__name__+": "+str(e)[:180]}),flush=True)
            await asyncio.gather(*(one(n,u) for n,u in targets.items()))
            await http.close()
          asyncio.run(main())
          PY
