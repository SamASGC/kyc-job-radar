name: v3.9 - seven verified official ATS board recoveries
# rerun regression after recognizing authenticated-free Riskified Greenhouse source
on:
  push:
    branches: ["fix/v3-9-further-official-ats-recovery"]
    paths: [".github/workflows/v3_9_full_smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile and test all v2-v3.9 invariants
        run: |
          python -m compileall -q radar.py job_radar tests
          python -m unittest discover -s tests -v
      - name: Full live scan isolated from production Git branch
        run: python radar.py scan
      - name: 500 firms and seven public ATS independent live evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("public/sources.json").read_text(encoding="utf-8"))
          state=json.loads(Path("data/state.json").read_text(encoding="utf-8"))
          names=("Riskified","ComplyAdvantage","Veriff","Alloy","PPRO",
                 "Clear Junction","Strise")
          by={r["company"]:r for r in s["sources"]}
          print("VERIFIED_RECOVERY_V39",json.dumps({n:{"result":by[n]["result"],
            "jobs":by[n]["jobs_found"]} for n in names},ensure_ascii=False))
          print("SCANNED_V39",json.dumps({k:s[k] for k in
            ("direct_configured","ats_explicit","reached","errors","with_jobs")}))
          print("HISTORIC_SEEN_V39",len(state["seen"]))
          assert s["direct_configured"]==500
          assert s["ats_explicit"]==169
          assert len(state["seen"])>=306
          for name in names:
            assert by[name]["result"]=="ok" and by[name]["jobs_found"]>0,(name,by[name])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-9-live-health-and-requisitions
          path: |
            public/sources.json
            data/health.json
            data/quality_audit.json
          if-no-files-found: warn
