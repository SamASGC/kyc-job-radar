name: Radar v2 — Import licensed fintech directory (isolated)

on:
  push:
    branches:
      - "feat/radar-v2-strict-quality"
    paths:
      - ".github/workflows/v2_directory_import.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v2-directory-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/radar-v2-strict-quality
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Download and validate CC BY 4.0 fintech register
        run: python scripts/sync_licensed_fintech_register.py --out data/fintech_directory.json
      - name: Validate directory size and website sanity
        run: |
          python - <<'PY'
          import json
          x=json.load(open("data/fintech_directory.json",encoding="utf-8"))
          live=sum(bool(c.get("website")) for c in x)
          print(f"Unique licensed firms: {len(x)}, websites: {live}")
          assert len(x) >= 200
          assert live > 40
          assert all(c.get("license") == "CC BY 4.0" for c in x)
          PY
      - name: Save licensed directory on development branch only
        run: |
          git config user.name "kyc-radar-bot"
          git config user.email "kyc-radar-bot@users.noreply.github.com"
          git add data/fintech_directory.json
          if ! git diff --cached --quiet; then
            git commit -m "data(v2): licensed fintech directory snapshot [skip ci]"
            git pull --rebase origin feat/radar-v2-strict-quality
            git push origin HEAD:feat/radar-v2-strict-quality
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v2-fintech-directory-metrics
          path: data/fintech_directory.json
          retention-days: 7
