name: v3.15 - Sygnum Salesforce public vacancies markup analysis
on:
  push:
    branches: ["fix/v3-15-public-recruitment-portals"]
    paths: [".github/workflows/v3_15_sygnum_markup.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Inspect first-party vacancy table and link semantics
        run: |
          python - <<'PY'
          import asyncio,json,re
          from bs4 import BeautifulSoup
          from job_radar.http import Http
          URL="https://sygnumpeopleportal.my.salesforce-sites.com/recruit/fRecruit__ApplyJobList"
          async def main():
            h=Http(concurrency=2,timeout=22)
            try:
              r=await h.get(URL)
              soup=BeautifulSoup(r.text,"html.parser")
              rows=soup.select("table tr")
              print("SYGNUM_STRUCT",json.dumps({
                "status":r.status_code,"bytes":len(r.content),"title":soup.title.get_text(" ",strip=True) if soup.title else "",
                "table_count":len(soup.select("table")),"rows":len(rows),
                "anchors":len(soup.select("a[href]")),
                "vacancy_ids":list(dict.fromkeys(re.findall(r"VN\\d+",r.text)))[:80],
                "openings_text":r.text.lower().count("posting title")},ensure_ascii=False))
              for row in rows[:25]:
                print("SYGNUM_ROW",json.dumps({"text":row.get_text(" ",strip=True)[:260],
                    "html":str(row)[:750],
                    "links":[{"text":a.get_text(" ",strip=True)[:100],"href":a.get("href",""),
                       "onclick":a.get("onclick","")[:140]} for a in row.select("a")[:3]]},ensure_ascii=False))
              for a in soup.select("a[href]")[:80]:
                if "job" in (a.get("href") or "").lower() or "apply" in (a.get("href") or "").lower() or a.get("onclick"):
                  print("SYGNUM_LINK",json.dumps({"text":a.get_text(" ",strip=True)[:120],"href":a.get("href"),
                     "onclick":(a.get("onclick") or "")[:180]}))
            finally:await h.close()
          asyncio.run(main())
          PY
