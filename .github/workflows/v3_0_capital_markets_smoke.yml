name: Radar v3.0 — 375 capital markets smoke

on:
  push:
    branches: ["feat/v3-0-capital-markets-375"]
    paths: [".github/workflows/v3_0_capital_markets_smoke.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Unit regressions and compile
        run: |
          python -m compileall -q radar.py job_radar tests
          python -m unittest discover -s tests -v
      - name: Full live scan in isolation (no push or Pages)
        run: python radar.py scan
      - name: Verify source health, original dates and historical ledger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          inv=json.loads(Path("public/sources.json").read_text())
          audit=json.loads(Path("data/quality_audit.json").read_text())
          state=json.loads(Path("data/state.json").read_text())
          health=json.loads(Path("data/health.json").read_text())
          assert inv["direct_configured"]==375,inv["direct_configured"]
          assert inv["ats_explicit"]>=140,inv["ats_explicit"]
          assert len(state["seen"])>=305,len(state["seen"])
          ats=["Clear Street","TRM Labs","FalconX","GSR Markets",
               "DigitalBridge","PINE Advisor Solutions","Nansen",
               "Galaxy Digital","Alpaca Markets","Morpho",
               "Thrivo Wealth Partners","Windranger Labs","Unison Infrastructure"]
          portals=["VZ VermögensZentrum","GAM Investments","Pemberton Asset Management",
                   "Schroders","Hamilton Lane","Aquila Capital","Zodia Custody",
                   "Taurus SA","Man Group","Wintermute","Gemini Exchange","Anchorage Digital"]
          records={x["company"]:x for x in inv["sources"]}
          checks={x["company"]:x for x in health["sources"]}
          assert all(x in records for x in ats+portals)
          def status(n):
              r=records[n];c=checks.get(n,{})
              return {"result":r["result"],"jobs":r["jobs_found"],
                      "error":str(c.get("error",""))[:250]}
          print("NEW_ATS_HEALTH",json.dumps({n:status(n) for n in ats},ensure_ascii=False))
          print("NEW_PORTALS_HEALTH",json.dumps({n:status(n) for n in portals},ensure_ascii=False))
          print("COVERAGE",json.dumps({"direct":inv["direct_configured"],
             "ats":inv["ats_explicit"],"rotating":inv["rotating_checked"],
             "reached":inv["reached"],"errors":inv["errors"],
             "raw_productive":inv["with_jobs"]}))
          print("QUALITY",json.dumps({"raw":audit["raw_total"],
             "candidates":audit["prefiltered_candidates"],
             "verified":audit["official_apply_page_verified"],
             "rejections":audit["verification_reasons"],
             "seen":len(state["seen"])}))
          for name in ("index.html","status.html","review.html","sources.html","feed.xml"):
              assert (Path("public")/name).is_file(),name
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-0-capital-markets-health
          path: |
            data/quality_audit.json
            data/health.json
            public/sources.json
            public/status.json
          if-no-files-found: warn
