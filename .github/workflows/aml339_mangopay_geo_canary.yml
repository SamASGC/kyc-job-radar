name: AML339 Mangopay same-job detail geography
on:
  pull_request:
    paths:
      - 'experiments/aml339/live_e2e18_full.py'
      - 'tests/test_aml339_mangopay_detail_geography.py'
      - '.github/workflows/aml339_mangopay_geo_canary.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 -m unittest discover -s tests -p test_aml339_mangopay_detail_geography.py -v
      - name: Verify original 339 archive and unpack isolated, read-only parser
        shell: bash
        run: |
          set -euo pipefail
          echo 'e8a08263115c4bbbaf02d4a4ae59431a7e4b16a0a7c79e339ff2f53ef9aadc02  experiments/aml339/full_original_339_sources.zip' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/aml339/experiments/aml339"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("experiments/aml339/full_original_339_sources.zip") as z:
              allowed={"amlradar/__init__.py","amlradar/model.py","amlradar/net.py",
                       "amlradar/employer_links.py","amlradar/sources.py","fuentes.json",
                       "VALIDAR_REAL_SIN_TOCAR_DATOS.py"}
              assert set(z.namelist())==allowed
              assert sum(f.file_size for f in z.infolist())<800_000
              assert all(not x.filename.startswith("/") and ".." not in Path(x.filename).parts for x in z.infolist())
              z.extractall(Path(os.environ["RUNNER_TEMP"])/"aml339")
          PY
          cp experiments/aml339/{repair_sources_20261121.py,quality_audit.py,live_e2e18_full.py,two_lane_alert_preview.py,batch50_sources.py,live_batch50_probe.py} "$RUNNER_TEMP/aml339/"
          cd "$RUNNER_TEMP/aml339"
          python3 repair_sources_20261121.py
          python3 quality_audit.py --self-test
      - name: Run existing production batch driver for Mangopay only
        run: |
          cd "$RUNNER_TEMP/aml339"
          python3 "$GITHUB_WORKSPACE/experiments/aml339/hourly_http_guard.py" run --prior "$GITHUB_WORKSPACE/data/aml339_http_cooldowns.json" --receipt http_pause_mangopay.json live_batch50_probe.py --source mangopay --out candidate_mangopay.json
          python3 - <<'PY'
          import json
          r=json.load(open("candidate_mangopay.json"))["sources"][0]
          print("MANGOPAY_DETAIL_GEO",json.dumps({"listed":r["total_listed"],"complete":r["list_complete"],"unverified":r["unverified_in_scope"],"skipped_after_detail":r["skipped_application_after_detail_geo"],"details":[{k:j.get(k) for k in ("title","location","verification_error","application_skipped_after_detail_geo")} for j in r["audited"]]}),flush=True)
          assert r["list_complete"] and r["unverified_in_scope"]==0
          assert len(r["audited"])==r["relevant_leads"]
          assert len(r["listing_role_keys"])==r["total_listed"]
          for j in r["audited"]:
              if j["application_skipped_after_detail_geo"]:
                  assert j["evaluation"]["geography"]=="outside_scope" and not j["evaluation"]["application_verified"] and not j["apply_url"]
          assert r["skipped_application_after_detail_geo"]>0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aml339-mangopay-detail-geo
          path: |
            ${{ runner.temp }}/aml339/candidate_mangopay.json
            ${{ runner.temp }}/aml339/http_pause_mangopay.json
          if-no-files-found: warn
