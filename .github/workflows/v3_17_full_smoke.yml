name: v3.17 - 500 direct employers IQ-EQ live SmartRecruiters acceptance
on:
  push:
    branches: ["fix/v3-17-iqeq-smartrecruiters"]
    paths: [".github/workflows/v3_17_full_smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile and run entire strict-quality regression suite
        run: |
          python -m compileall -q radar.py job_radar tests
          python -m unittest discover -s tests -v
      - name: Real 500 employer source scan, isolated from production state
        run: python radar.py scan
      - name: Validate all IQ-EQ pages and Swiss bank sources without relaxing gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path("public/sources.json").read_text(encoding="utf-8"))
          seen=json.loads(Path("data/state.json").read_text(encoding="utf-8"))["seen"]
          by={x["company"]:x for x in src["sources"]}
          names=("IQ-EQ","Raiffeisen Switzerland","Berner Kantonalbank",
                 "Worldpay","VP Bank Group","Northern Trust","Revolut","Kutxabank")
          print("V317_SOURCES",json.dumps({n:{"result":by[n]["result"],
             "jobs":by[n]["jobs_found"]} for n in names},ensure_ascii=False))
          print("V317_COVERAGE",json.dumps({k:src[k] for k in
             ("direct_configured","ats_explicit","reached","errors","with_jobs")}))
          print("V317_LIFETIME_SEEN",len(seen))
          assert src["direct_configured"]==500
          assert src["ats_explicit"]==182
          assert len(seen)>=306
          assert by["IQ-EQ"]["result"]=="ok" and by["IQ-EQ"]["jobs_found"]>=105
          assert by["Raiffeisen Switzerland"]["jobs_found"]>=50
          assert by["Berner Kantonalbank"]["jobs_found"]>=3
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-17-iqeq-official-source-health
          path: |
            public/sources.json
            data/health.json
            data/quality_audit.json
          if-no-files-found: warn
