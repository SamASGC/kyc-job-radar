name: Radar v2 quality gates

on:
  pull_request:
    paths:
      - "radar.py"
      - "job_radar/**"
      - "tests/**"
      - "config/profile.yaml"
      - ".github/workflows/v2_tests.yml"
  push:
    branches:
      - "feat/radar-v2-strict-quality"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m compileall -q radar.py job_radar tests
      - run: python -m unittest discover -s tests -v
