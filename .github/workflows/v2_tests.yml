name: Radar v2 quality gates

on:
  pull_request:
    paths:
      - "radar.py"
      - "job_radar/**"
      - "tests/**"
      - "config/profile.yaml"
      - ".github/workflows/v2_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

# Pull requests get a fresh quality run on every push. Older queued copies
# validate superseded code and slow release acceptance when many small fixes
# land. Retain only the newest quality run per PR/ref; the independent
# production pipeline and its historical integrity guard are unaffected.
concurrency:
  group: v2-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m compileall -q radar.py job_radar tests
      - run: python -m unittest discover -s tests -v
