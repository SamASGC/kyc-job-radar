name: Radar v2.2 — 208-company isolated production smoke

on:
  push:
    branches: ["feat/v2-2-web-enrichment"]
    paths: [".github/workflows/v2_2_full_smoke.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: All employer and ATS sources, isolated (no commit or pages publish)
        run: python radar.py scan
      - name: Explain coverage and verified-only results
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state=Path("data/state.json")
          health=Path("data/health.json")
          if health.exists():
              d=json.loads(health.read_text())
              sources=d.get("sources",[])
              print("SOURCE_CHECKS",len(sources))
              print("SOURCES_REACHABLE",sum(bool(s.get("ok")) for s in sources))
              print("ATS_WITH_JOBS",sum(bool(s.get("ok")) and s.get("jobs",0)>0 for s in sources))
              print("MISATTRIBUTED_DUE", [s for s in sources if s.get("company")=="Due"][:1])
          if state.exists():
              d=json.loads(state.read_text())
              print("NOTIFIED_LEDGER",len(d.get("seen",{})))
              print("VERIFIED_OPEN_JOBS",len(d.get("jobs",{})))
          for path in ("public/index.html","public/feed.xml","public/status.html","public/review.html"):
              print("GENERATED",path,Path(path).exists())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-2-quality-diagnostics
          path: |
            data/quality_audit.json
            data/health.json
            public/status.json
          if-no-files-found: warn
