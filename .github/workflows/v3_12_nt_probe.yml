name: v3.12 - Northern Trust official Workday public feed probe
on:
  push:
    branches: ["fix/v3-12-northerntrust-workday"]
    paths: [".github/workflows/v3_12_nt_probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Validate Northern Trust employer-owned Workday requisitions
        run: |
          python - <<'PY'
          import asyncio,json
          from job_radar.http import Http
          from job_radar.sources.workday import fetch_workday
          async def main():
            h=Http(concurrency=8,timeout=16)
            url="https://ntrs.wd1.myworkdayjobs.com/northerntrust"
            try:
              jobs=await asyncio.wait_for(fetch_workday(h,{"name":"Northern Trust","sector":"Banca","careers_url":url},url),timeout=90)
              print("NT_PROBE",json.dumps({"count":len(jobs),
                  "sample":[{"title":j.title,"url":j.apply_url,"posted":j.posted_at} for j in jobs[:5]]},ensure_ascii=False))
              assert len(jobs)>=20
              assert all("ntrs.wd1.myworkdayjobs.com" in j.apply_url for j in jobs)
            finally:
              await h.close()
          asyncio.run(main())
          PY
