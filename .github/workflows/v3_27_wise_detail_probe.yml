name: v3.27 Wise SmartRecruiters listing/detail integrity probe
on:
  push:
    branches: ["feat/v3-27-official-ats-source-health"]
    paths: [".github/workflows/v3_27_wise_detail_probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compare Wise public list with job-specific API and actual job HTML
        run: |
          python - <<'PY'
          import asyncio,json,re
          from bs4 import BeautifulSoup
          from job_radar.http import Http
          async def main():
            h=Http(concurrency=4,timeout=18)
            try:
              base="https://api.smartrecruiters.com/v1/companies/Wise/postings"
              r=await h.get(base+"?limit=20"); data=r.json()
              row=next((x for x in data.get("content",[]) if "KYC" in str(x.get("name")) or "FinCrime" in str(x.get("name"))),data["content"][0])
              jid=row["id"]
              print("V327_WISE_LIST",json.dumps({"keys":list(row.keys()),"data":row},ensure_ascii=False)[:3800])
              for url in (base+"/"+jid,"https://jobs.smartrecruiters.com/Wise/"+jid):
                try:
                  rr=await h.get(url)
                  obj=rr.json() if "json" in rr.headers.get("content-type","").lower() else None
                  soup=BeautifulSoup(rr.text,"html.parser")
                  title=soup.title.get_text(" ",strip=True) if soup.title else ""
                  scripts=[x.get_text(" ",strip=True)[:500] for x in soup.find_all("script",attrs={"type":"application/ld+json"})]
                  print("V327_WISE_DETAIL",json.dumps({"url":url,"status":rr.status_code,"content_type":rr.headers.get("content-type",""),"object_keys":list(obj.keys()) if isinstance(obj,dict) else None,"jobAd_keys":list((obj.get("jobAd") or {}).keys()) if isinstance(obj,dict) else None,"name":obj.get("name") if isinstance(obj,dict) else None,"releasedDate":obj.get("releasedDate") if isinstance(obj,dict) else None,"title":title,"ldjson":scripts[:2],"body_excerpt":soup.get_text(" ",strip=True)[:500]},ensure_ascii=False)[:4400])
                except Exception as ex:
                  print("V327_WISE_DETAIL_ERROR",json.dumps({"url":url,"error":str(ex)[:350]}))
            finally:await h.close()
          asyncio.run(main())
          PY
