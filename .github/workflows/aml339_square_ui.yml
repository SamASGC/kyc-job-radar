name: AML339 Square Flatchr public coverage diagnostic
on:
  pull_request:
    paths:
      - 'experiments/aml339/audit_square_ui.py'
      - '.github/workflows/aml339_square_ui.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: current-main
          sparse-checkout: data/aml339_http_cooldowns.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Chromium
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Compare public pagination and application controls
        run: |
          python experiments/aml339/audit_square_ui.py --prior current-main/data/aml339_http_cooldowns.json --receipt http_pause_square.json --out square_ui.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aml339-square-ui
          path: |
            square_ui.json
            http_pause_square.json
          if-no-files-found: error
          retention-days: 30
