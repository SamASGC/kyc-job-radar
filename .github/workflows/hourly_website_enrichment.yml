name: Find missing fintech websites (hourly)

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: write

concurrency:
  group: licensed-fintech-website-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check missing legal entities (Wikidata + matching homepage)
        run: python -m scripts.enrich_missing_websites --limit 20
      - name: Save evidence and checked ledger; never mutate licensed register
        run: |
          git config user.name "kyc-radar-bot"
          git config user.email "kyc-radar-bot@users.noreply.github.com"
          git add data/enrichment_state.json data/verified_company_websites.json
          if git diff --cached --quiet; then
            echo "No enrichment changes."
          else
            git commit -m "data: incremental employer website verification [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Provider and verification summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/enrichment_state.json")
          q=Path("data/verified_company_websites.json")
          ledger=json.loads(p.read_text()) if p.exists() else {}
          verified=json.loads(q.read_text()) if q.exists() else []
          print("Attempted unique missing legal entities:",len(ledger.get("attempted",{})))
          print("Websites with confirmed entity/country/brand:",len(verified))
          print("Last provider status:",ledger.get("last_run_status","not run"))
          print("Those websites join the main radar's next scheduled ATS discovery sweep.")
          PY
