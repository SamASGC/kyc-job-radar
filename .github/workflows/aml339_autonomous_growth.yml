name: AML339 autonomous regulated employer growth
# Expansion closed: no scheduled, push, or PR discovery. Manual recovery only.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aml339-autonomous-growth-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      count: ${{ steps.batch.outputs.count }}
      shards: ${{ steps.batch.outputs.shards }}
      refreshed: ${{ steps.batch.outputs.refreshed }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: aml339-growth-evidence
          path: previous
          persist-credentials: false
      - name: Select up to 50 unprocessed regulated employer leads
        id: batch
        run: |
          python3 experiments/aml339/growth_discovery.py --ledger previous/growth/ledger.json --out selection.json
          python3 - <<'PY'
          import json,os
          d=json.load(open("selection.json"))
          n=len(d["selected"])
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              print("count="+str(n),file=f)
              print("shards="+json.dumps(list(range(max(1,(n+4)//5))),separators=(",",":")),file=f)
              print("refreshed="+str(d.get("discovery_refreshed",False)).lower(),file=f)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: growth-selection
          path: selection.json
          retention-days: 30
  audit:
    needs: select
    if: ${{ needs.select.outputs.count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: growth-selection
          path: selection
      - name: Prepare immutable isolated parser
        shell: bash
        run: |
          set -euo pipefail
          echo 'e8a08263115c4bbbaf02d4a4ae59431a7e4b16a0a7c79e339ff2f53ef9aadc02  experiments/aml339/full_original_339_sources.zip' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/aml339"
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import os
          with ZipFile("experiments/aml339/full_original_339_sources.zip") as z:
              assert set(z.namelist())=={"amlradar/__init__.py","amlradar/model.py","amlradar/net.py","amlradar/employer_links.py","amlradar/sources.py","fuentes.json","VALIDAR_REAL_SIN_TOCAR_DATOS.py"}
              assert sum(x.file_size for x in z.infolist())<800_000
              z.extractall(Path(os.environ["RUNNER_TEMP"])/"aml339")
          PY
          cp experiments/aml339/repair_sources_20261121.py "$RUNNER_TEMP/aml339/"
          cd "$RUNNER_TEMP/aml339"
          python3 repair_sources_20261121.py
      - name: Audit five independent entities with bounded per-source requests
        env:
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          python3 - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          root=Path.cwd()
          selected=json.loads((root/"selection/selection.json").read_text())["selected"]
          shard=int(os.environ["SHARD"])
          parser=Path(os.environ["RUNNER_TEMP"])/"aml339"
          env=dict(os.environ,PYTHONPATH=str(parser))
          # No write tokens or checkout credentials are provided to public-site workers.
          for row in selected[shard*5:shard*5+5]:
              key=row["key"]
              assert key.isascii() and key.isalnum()
              out=root/"results"/f"result_{key}.json"
              try:
                  subprocess.run([sys.executable,str(root/"experiments/aml339/growth_worker.py"),"--selection",str(root/"selection/selection.json"),"--key",key,"--out",str(out)],cwd=parser,env=env,timeout=240,check=False)
              except subprocess.TimeoutExpired:
                  print("GROWTH_TIMEOUT",key,flush=True)
              if not out.exists():
                  out.write_text(json.dumps({"id":row["id"],"key":key,"name":row["name"],"country":row["country"],"verified":False,"status":"AUDIT_TIMEOUT_OR_MISSING"}))
          (root/"results"/"shard.txt").write_text(str(shard))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growth-shard-${{ matrix.shard }}
          path: results/
          retention-days: 30
          if-no-files-found: error
  report:
    needs: [select,audit]
    if: ${{ always() && needs.select.result == 'success' && (needs.select.outputs.count != '0' || needs.select.outputs.refreshed == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: aml339-growth-evidence
          path: previous
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: growth-selection
          path: selection
      - uses: actions/download-artifact@v4
        if: ${{ needs.select.outputs.count != '0' }}
        with:
          pattern: growth-shard-*
          path: reports
      - name: Reconcile all candidate dispositions and generate proposals
        run: |
          python3 experiments/aml339/growth_report.py --selection selection/selection.json --previous previous/growth/ledger.json --reports reports --out growth --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: aml339-growth-evidence
          path: growth/
          retention-days: 90
  persist:
    needs: report
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.report.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aml339-growth-evidence
      - uses: actions/download-artifact@v4
        with:
          name: aml339-growth-evidence
          path: growth
      - name: Commit evidence only to dedicated branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          files={p.name for p in Path("growth").iterdir()}
          assert files=={"ledger.json","latest.json","review_proposals.json"}
          d=json.loads(Path("growth/latest.json").read_text())
          assert d["run_id"]==int(os.environ["GITHUB_RUN_ID"])
          assert 0<=d["selected"]<=50
          assert sum(d["dispositions"].values())==d["selected"]
          assert json.loads(Path("growth/ledger.json").read_text())["schema"]=="aml339_growth_ledger_v1"
          PY
          git config user.name "aml339-growth-bot"
          git config user.email "aml339-growth-bot@users.noreply.github.com"
          git add -- growth/ledger.json growth/latest.json growth/review_proposals.json
          if ! git diff --cached --quiet; then
            git commit -m "aml339: growth evidence run $GITHUB_RUN_ID [skip ci]"
            git push origin HEAD:refs/heads/aml339-growth-evidence
          fi
