name: Radar v3.2 - 425 financial sources smoke

on:
  push:
    branches: ["feat/v3-2-priority-financial-425"]
    paths: [".github/workflows/v3_2_financial_sources_smoke.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: All regression tests and compilation
        run: |
          python -m compileall -q radar.py job_radar tests
          python -m unittest discover -s tests -v
      - name: Full isolated live employer and rotating source scan
        run: python radar.py scan
      - name: Audit employer ATS identity, source health, dates and seen history
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          inv=json.loads(Path("public/sources.json").read_text())
          audit=json.loads(Path("data/quality_audit.json").read_text())
          state=json.loads(Path("data/state.json").read_text())
          health=json.loads(Path("data/health.json").read_text())
          assert inv["direct_configured"]==425, inv["direct_configured"]
          assert inv["ats_explicit"]>=151, inv["ats_explicit"]
          assert len(state["seen"])>=305,len(state["seen"])
          ats=["Numeus","WhiteTech","RootstockLabs","Dialectic",
               "Capstone Investment Advisors","Vestwell","ATLAS SP"]
          portals=[
            "Zuger Kantonalbank","Schwyzer Kantonalbank",
            "Schaffhauser Kantonalbank","Glarner Kantonalbank",
            "Appenzeller Kantonalbank","Berner Kantonalbank",
            "Nidwaldner Kantonalbank","BancaStato",
            "Hypothekarbank Lenzburg","Migros Bank","Bank Avera",
            "Inbank","Bigbank","Holm Bank","Urbo Bank","Paysera",
            "Spuerkeess","Banque Raiffeisen Luxembourg"]
          records={x["company"]:x for x in inv["sources"]}
          checks={x["company"]:x for x in health["sources"]}
          assert all(n in records for n in ats+portals)
          def entry(n):
              r=records[n]
              c=checks.get(n,{})
              return {
                  "status":r["result"],
                  "raw_jobs":r["jobs_found"],
                  "error":str(c.get("error",""))[:220]
              }
          print("NEW_ATS_HEALTH",json.dumps({n:entry(n) for n in ats},ensure_ascii=False))
          print("NEW_PORTAL_HEALTH",json.dumps({n:entry(n) for n in portals},ensure_ascii=False))
          print("COVERAGE",json.dumps({
              "direct":inv["direct_configured"],
              "ats":inv["ats_explicit"],
              "rotating":inv["rotating_checked"],
              "reached":inv["reached"],
              "errors":inv["errors"],
              "raw_productive":inv["with_jobs"]
          }))
          print("QUALITY",json.dumps({
              "raw":audit["raw_total"],
              "potential_scope":audit["official_in_scope"],
              "original_date_missing":audit["original_date_missing"],
              "original_date_expired":audit["original_date_expired"],
              "date_recent":audit["original_date_recent"],
              "verified":audit["official_apply_page_verified"],
              "verification_reasons":audit["verification_reasons"],
              "seen":len(state["seen"])
          }))
          for filename in ("index.html","review.html","sources.html",
                           "status.html","feed.xml"):
              assert (Path("public")/filename).is_file(),filename
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-2-financial-source-audit
          path: |
            data/quality_audit.json
            data/health.json
            public/sources.json
            public/status.json
          if-no-files-found: warn
