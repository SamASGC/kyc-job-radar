name: Radar v3.6 - 500 financial employers live smoke
on:
  push:
    branches: ["feat/v3-6-500-verifiable-financial-employers"]
    paths: [".github/workflows/v3_6_500_smoke.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-500:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile and run all regression tests
        run: |
          python -m compileall -q radar.py job_radar tests
          python -m unittest discover -s tests -v
      - name: Full live-data scan, isolated from production state
        run: python radar.py scan
      - name: Validate 500/157, review outcomes and historical dedup
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src = json.loads(Path("public/sources.json").read_text(encoding="utf-8"))
          state = json.loads(Path("data/state.json").read_text(encoding="utf-8"))
          audit = json.loads(Path("data/quality_audit.json").read_text(encoding="utf-8"))
          names = {
              "Lightyear", "Leonteq", "Cecabank", "BancaStato", "Kutxabank",
              "Finbee", "Saldo Bank", "Bellevue Group",
              "CBH Compagnie Bancaire Helvétique", "Reichmuth & Co Privatbankiers",
              "ODDO BHF", "European Investment Bank", "European Stability Mechanism",
              "FIS Global", "Temenos", "Banco Cetelem", "Coop Pank",
              "Luxembourg Stock Exchange", "European Investment Fund", "Maerki Baumann",
              "Banco Pichincha España", "JPMorgan Chase", "Morgan Stanley",
              "Goldman Sachs", "Franklin Templeton", "Invesco"
          }
          indexed = {r["company"]:r for r in src["sources"]}
          assert src["direct_configured"] == 500, src["direct_configured"]
          assert src["ats_explicit"] == 157, src["ats_explicit"]
          assert len(state["seen"]) >= 306, len(state["seen"])
          assert names <= indexed.keys(), names - indexed.keys()
          good = [n for n in names if indexed[n]["result"] == "ok"]
          productive = [n for n in names if indexed[n]["jobs_found"] > 0]
          print("COVERAGE", json.dumps({k:src[k] for k in ("direct_configured",
              "ats_explicit", "rotating_checked", "reached", "errors",
              "not_checked", "with_jobs")}))
          print("NEW_SOURCE_RESULTS",json.dumps({n:{
              "result":indexed[n]["result"],"jobs":indexed[n]["jobs_found"]
          } for n in sorted(names)},ensure_ascii=False))
          print("LIVE_SOURCE_REACHABLE",len(good))
          print("LIVE_SOURCE_PRODUCTIVE",len(productive))
          print("LIFETIME_SEEN",len(state["seen"]))
          print("FUNNEL",json.dumps({k:v for k,v in audit.items()
                if not isinstance(v,list)},ensure_ascii=False))
          assert len(good) >= 18, "Too many newly registered employers were unreachable"
          assert len(productive) >= 5, "Not enough new sources expose real job listings"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-v3-6-500-source-health-and-quality-audit
          path: |
            data/quality_audit.json
            data/health.json
            public/sources.json
          if-no-files-found: warn
