name: Radar v3.3 - 450 financial employers live smoke

on:
  push:
    branches: ["feat/v3-3-banking-450"]
    paths: [".github/workflows/v3_3_banking_450_smoke.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Regression tests and compilation
        run: |
          python -m compileall -q radar.py job_radar tests
          python -m unittest discover -s tests -v
      - name: Full real scan, isolated without production writes
        run: python radar.py scan
      - name: Audit each new employer, strict job quality and seen ledger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          inv=json.loads(Path("public/sources.json").read_text())
          audit=json.loads(Path("data/quality_audit.json").read_text())
          state=json.loads(Path("data/state.json").read_text())
          health=json.loads(Path("data/health.json").read_text())
          assert inv["direct_configured"]==450, inv["direct_configured"]
          assert inv["ats_explicit"]==152, inv["ats_explicit"]
          assert len(state["seen"])>=305,len(state["seen"])
          names=[
            "Berner Kantonalbank","Schaffhauser Kantonalbank","Urner Kantonalbank",
            "Obwaldner Kantonalbank","Banque Piguet Galland","Banque Heritage",
            "Cembra Money Bank","Bank WIR","SME Bank Lithuania","Mano Bank",
            "Swiss Life Asset Managers","Foyer Group","Kaiser Partner Privatbank",
            "Banque de Commerce et de Placements","Bordier & Cie","Gonet & Cie",
            "Baloise Luxembourg","fundcraft","Moonfare","Candriam",
            "JPMorgan Chase","Morgan Stanley","Goldman Sachs","Banco Santander",
            "NextEnergy Group"]
          records={x["company"]:x for x in inv["sources"]}
          checks={x["company"]:x for x in health["sources"]}
          assert len(names)==25
          assert all(n in records for n in names)
          def entry(n):
            r=records[n];c=checks.get(n,{})
            return {"status":r["result"],"raw_jobs":r["jobs_found"],
                    "error":str(c.get("error",""))[:220]}
          print("NEW_EMPLOYER_HEALTH",json.dumps({n:entry(n) for n in names},ensure_ascii=False))
          print("COVERAGE",json.dumps({
              "direct":inv["direct_configured"],"ats":inv["ats_explicit"],
              "rotating":inv["rotating_checked"],"reached":inv["reached"],
              "errors":inv["errors"],"raw_productive":inv["with_jobs"]
          }))
          print("QUALITY",json.dumps({
              "raw":audit["raw_total"],"potential_scope":audit["official_in_scope"],
              "date_missing":audit["original_date_missing"],
              "date_expired":audit["original_date_expired"],
              "date_recent":audit["original_date_recent"],
              "apply_verified":audit["official_apply_page_verified"],
              "rejections":audit["verification_reasons"],"seen":len(state["seen"])
          }))
          for filename in ("index.html","review.html","sources.html","status.html","feed.xml"):
            assert (Path("public")/filename).is_file(), filename
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-3-financial-employers-audit
          path: |
            data/quality_audit.json
            data/health.json
            public/sources.json
            public/status.json
          if-no-files-found: warn
