name: AML350 final macro33 employer batch
on:
  pull_request:
    paths:
      - 'experiments/aml339/audit_final_macro33.py'
      - '.github/workflows/aml339_final_macro33.yml'
permissions:
  contents: read
jobs:
  audit:
    name: Audit final-macro33 ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        source: [visa-currencycloud, bjak, binance, booming-games, b2spin, yassir, nexo, finary, sportygroup, primexbt, 21shares, capimoney, lt-nayax-global-legal-compliance, external-morgan-stanley, external-vanguard, external-fnz, external-cmc-markets, external-met-group, external-talan, external-aduna, external-manulife, external-american-express, external-citi, external-bny, external-deutsche-boerse, external-barclays, external-kroll, external-inetum, external-fayara, external-langham-hall, external-ao-shearman, external-hsf-kramer, external-vistra]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        with:
          ref: main
          path: current-main
          sparse-checkout: |
            data/aml339_http_cooldowns.json
            public/aml339/desktop.json
            experiments/aml339/external_live_registry.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify original 339 archive and unpack isolated, read-only parser
        shell: bash
        run: |
          set -euo pipefail
          echo 'e8a08263115c4bbbaf02d4a4ae59431a7e4b16a0a7c79e339ff2f53ef9aadc02  experiments/aml339/full_original_339_sources.zip' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/aml339/experiments/aml339"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("experiments/aml339/full_original_339_sources.zip") as z:
              allowed={"amlradar/__init__.py","amlradar/model.py","amlradar/net.py",
                       "amlradar/employer_links.py","amlradar/sources.py","fuentes.json",
                       "VALIDAR_REAL_SIN_TOCAR_DATOS.py"}
              assert set(z.namelist())==allowed
              assert sum(f.file_size for f in z.infolist())<800_000
              assert all(not x.filename.startswith("/") and ".." not in Path(x.filename).parts for x in z.infolist())
              z.extractall(Path(os.environ["RUNNER_TEMP"])/"aml339")
          PY
          cp experiments/aml339/{repair_sources_20261121.py,quality_audit.py,live_e2e18_full.py,two_lane_alert_preview.py,live_external50_wave02.py,live_external50_next.py,live_external_generic.py,external_live_registry.py,external_live_registry.json,live_catalog_registry.py,audit_final_macro33.py} "$RUNNER_TEMP/aml339/"
          cp experiments/aml339/external_regulated50_wave02.json "$RUNNER_TEMP/aml339/experiments/aml339/"
          cd "$RUNNER_TEMP/aml339"
          python3 repair_sources_20261121.py
          python3 quality_audit.py --self-test
      - name: Audit official employer board and detect catalog aliases
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          cd "$RUNNER_TEMP/aml339"
          python3 "$GITHUB_WORKSPACE/experiments/aml339/hourly_http_guard.py" run --prior "$GITHUB_WORKSPACE/current-main/data/aml339_http_cooldowns.json" --receipt "http_pause_$SOURCE.json" audit_final_macro33.py --source "$SOURCE" --live "$GITHUB_WORKSPACE/current-main/public/aml339/desktop.json" --registry "$GITHUB_WORKSPACE/current-main/experiments/aml339/external_live_registry.json" --out "reviewed_$SOURCE.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aml339-final-macro33-${{ matrix.source }}
          path: |
            ${{ runner.temp }}/aml339/reviewed_*.json
            ${{ runner.temp }}/aml339/http_pause_*.json
          if-no-files-found: error
          retention-days: 30
  report:
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: aml339-final-macro33-*
          path: evidence
      - run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in Path("evidence").rglob("reviewed_*.json")]
          assert len(rows)==len({r["id"] for r in rows})==33
          print("HIRING_FIRST_TOTAL",json.dumps([{k:v for k,v in r.items() if k not in ("config","audit")} for r in rows]),flush=True)
          Path("final_macro33_summary.json").write_text(json.dumps(rows,ensure_ascii=False,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aml339-final-macro33-summary
          path: final_macro33_summary.json
          retention-days: 30
