name: Radar v2.6 — 284 financial sources smoke

on:
  push:
    branches: ["feat/v2-6-financial-sources-284"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile and run full test suite
        run: |
          python -m compileall -q radar.py job_radar tests
          python -m unittest discover -s tests -v
      - name: Scan real sources in isolation (no push or Pages)
        run: python radar.py scan
      - name: Report evidence, quality and ledger protection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path(".")
          inv = json.loads((root/"public/sources.json").read_text())
          audit = json.loads((root/"data/quality_audit.json").read_text())
          state = json.loads((root/"data/state.json").read_text())
          assert inv["direct_configured"] == 284, inv["direct_configured"]
          assert inv["ats_explicit"] >= 78, inv["ats_explicit"]
          assert len(state["seen"]) >= 305, len(state["seen"])
          names = ["Capco","Carta","Aztec Group","Arendt","Aspire",
                   "Sayari","IMC Trading","Flow Traders","BNY",
                   "Mirabaud Group","J. Safra Sarasin","Banque Cantonale Vaudoise",
                   "Zürcher Kantonalbank","Maples Group","Ocorian","Waystone",
                   "Euroclear","Deutsche Börse / Clearstream","Citi","JTC Group",
                   "FNZ","SS&C Technologies","Fidelity International",
                   "Rothschild & Co","BlackRock"]
          rec = {s["company"]:s for s in inv["sources"]}
          assert all(name in rec for name in names)
          print("NEW_SOURCE_HEALTH", json.dumps({
            n: {"status":rec[n]["result"],"raw_jobs":rec[n]["jobs_found"],
                "type":rec[n]["configured_feed"]}
            for n in names
          }))
          print("COVERAGE",json.dumps({
            "direct":inv["direct_configured"],"rotating":inv["rotating_checked"],
            "ats":inv["ats_explicit"],"reached":inv["reached"],
            "errors":inv["errors"],"with_jobs":inv["with_jobs"]
          }))
          print("QUALITY",json.dumps({
            "raw":audit["raw_total"],
            "candidates":audit["prefiltered_candidates"],
            "verified":audit["official_apply_page_verified"],
            "rejections":audit["verification_reasons"],
            "seen":len(state["seen"])
          }))
          for name in ("index.html","review.html","sources.html","status.html","feed.xml"):
            assert (root/"public"/name).is_file(),name
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-6-source-health-and-quality
          path: |
            data/quality_audit.json
            data/health.json
            public/sources.json
            public/status.json
          if-no-files-found: warn
