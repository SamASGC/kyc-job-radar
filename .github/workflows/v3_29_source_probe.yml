name: v3.29 first-party Teamtailor and Revolut date probe
on:
  push:
    branches: ["feat/v3-29-mangopay-teamtailor-first-party"]
    paths: [".github/workflows/v3_29_source_probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Examine public Mangopay job listings and exact original date evidence
        run: |
          python - <<'PY'
          import asyncio,json,re
          from urllib.parse import urljoin,urlsplit
          from bs4 import BeautifulSoup
          from job_radar.http import Http
          def job_jsonld(page):
              soup=BeautifulSoup(page,"html.parser")
              found=[]
              for s in soup.find_all("script",attrs={"type":"application/ld+json"}):
                  try:
                      j=json.loads(s.string or s.get_text() or "")
                      found.append(j)
                  except Exception:pass
              return found
          async def main():
              h=Http(concurrency=3,timeout=18)
              try:
                  for site in ("https://career.mangopay.com/jobs","https://www.revolut.com/careers/"):
                      try:
                          resp=await h.get(site);soup=BeautifulSoup(resp.text,"html.parser")
                          anchors=[(a.get_text(" ",strip=True)[:115],urljoin(str(resp.url),a.get("href",""))) for a in soup.select("a[href]")]
                          if "mangopay" in site:
                              roles=[x for x in anchors if re.search(r"/jobs/\d",x[1])]
                          else:
                              roles=[x for x in anchors if "/careers/position/" in x[1]]
                          roles=list(dict((u,(title,u)) for title,u in roles).values())
                          print("V329_LIST",json.dumps({"url":site,"status":resp.status_code,"final":str(resp.url),"links":len(anchors),"jobs":len(roles),"sample":roles[:12],"job_jsonld_count":len(job_jsonld(resp.text)),"page_chars":len(resp.text)},ensure_ascii=False))
                          for title,url in roles[:5]:
                              r=await h.get(url);sp=BeautifulSoup(r.text,"html.parser")
                              meta={x.get("property") or x.get("name"):x.get("content") for x in sp.select("meta[content]") if any(t in (x.get("property") or x.get("name") or "").lower() for t in ("published","date","modified","time"))}
                              scripts=job_jsonld(r.text)
                              print("V329_DETAIL",json.dumps({"site":site,"url":url,"status":r.status_code,"title":title,"meta":meta,"schemas":scripts[:2],"text_excerpt":sp.get_text(" ",strip=True)[:300],"apply_cta":bool(re.search(r"(?i)apply(?: for (?:this )?(?:job|role|position))?|submit application",sp.get_text(" ",strip=True))),"text_chars":len(sp.get_text(" ",strip=True))},ensure_ascii=False)[:6600])
                      except Exception as e: print("V329_ERROR",json.dumps({"site":site,"error":type(e).__name__+": "+str(e)[:240]}))
              finally:await h.close()
          asyncio.run(main())
          PY
