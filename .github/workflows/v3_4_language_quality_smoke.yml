name: Radar v3.4 - mandatory language regression and source quality smoke
on:
  push:
    branches: ["feat/v3-4-mandatory-language-gate"]
    paths: [".github/workflows/v3_4_language_quality_smoke.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile and unit test
        run: |
          python -m compileall -q radar.py job_radar tests
          python -m unittest discover -s tests -v
      - name: Isolated real smoke (cannot publish or push production)
        run: python radar.py scan
      - name: Assert language gate and dedup safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from job_radar.models import Job
          from job_radar.v2_quality import unmet_mandatory_languages
          state=json.loads(Path("data/state.json").read_text())
          inv=json.loads(Path("public/sources.json").read_text())
          audit=json.loads(Path("data/quality_audit.json").read_text())
          assert inv["direct_configured"] == 450, inv["direct_configured"]
          assert "mandatory_language_filtered" in audit, audit.keys()
          assert inv["ats_explicit"] >= 152, inv["ats_explicit"]
          assert len(state["seen"]) >= 306, len(state["seen"])
          languages={"Spanish","English","French"}
          active=state.get("jobs",{})
          for record in active.values():
              j=Job.from_dict({k:v for k,v in record.items() if k in Job.__dataclass_fields__})
              assert not unmet_mandatory_languages(j,languages), (j.company,j.title)
          assert not any(x.get("company")=="Luminor" and
              "risk specialist" in x.get("title","").casefold() for x in active.values()), active
          print("COVERAGE",inv["direct_configured"],inv["ats_explicit"])
          print("QUALITY",json.dumps({k:v for k,v in audit.items() if not isinstance(v,list)}))
          print("DEDUP",len(state["seen"]),"ACTIVE",len(active))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-4-language-quality-evidence
          path: |
            data/quality_audit.json
            data/health.json
            public/sources.json
          if-no-files-found: warn
