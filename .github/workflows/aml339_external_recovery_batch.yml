name: AML339 external recovery batch (15 difficult portals)
on:
  pull_request:
    paths:
      - 'experiments/aml339/audit_external_recovery.py'
      - '.github/workflows/aml339_external_recovery_batch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Recover ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        source: [reg50-connectpay, lt-emi-research-uab-blue-emi-lt, reg100-lt-uab-monavate, reg50-payhound, reg100-ie-currenxie-technologies-limited, reg100-nl-mews-financial-services-b-v, reg50-three-s-money, reg100-mt-weavr-europe-ltd, reg100-mt-moneybase-limited, reg100-cy-altery-eu-limited-formerly-named-heado-limited, lt-emi-research-paymont-uab, reg50-paysera-lt, reg50-finance-incorporated, lt-emi-research-satchelpay-uab, reg100-ie-decta-limited]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify original 339 archive and unpack isolated, read-only parser
        shell: bash
        run: |
          set -euo pipefail
          echo 'e8a08263115c4bbbaf02d4a4ae59431a7e4b16a0a7c79e339ff2f53ef9aadc02  experiments/aml339/full_original_339_sources.zip' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/aml339/experiments/aml339"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("experiments/aml339/full_original_339_sources.zip") as z:
              allowed={"amlradar/__init__.py","amlradar/model.py","amlradar/net.py",
                       "amlradar/employer_links.py","amlradar/sources.py","fuentes.json",
                       "VALIDAR_REAL_SIN_TOCAR_DATOS.py"}
              assert set(z.namelist())==allowed
              assert sum(f.file_size for f in z.infolist())<800_000
              assert all(not x.filename.startswith("/") and ".." not in Path(x.filename).parts for x in z.infolist())
              z.extractall(Path(os.environ["RUNNER_TEMP"])/"aml339")
          PY
          cp experiments/aml339/{repair_sources_20261121.py,quality_audit.py,live_e2e18_full.py,two_lane_alert_preview.py,live_external50_wave02.py,live_external50_next.py,live_external_generic.py,external_live_registry.py,external_live_registry.json,audit_external_recovery.py} "$RUNNER_TEMP/aml339/"
          cp experiments/aml339/external_regulated50_wave02.json "$RUNNER_TEMP/aml339/experiments/aml339/"
          cd "$RUNNER_TEMP/aml339"
          python3 repair_sources_20261121.py
          python3 quality_audit.py --self-test
      - name: Check actual official evidence
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          cd "$RUNNER_TEMP/aml339"
          python3 audit_external_recovery.py --source "$SOURCE" --out "recovery_$SOURCE.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aml339-recovery-${{ matrix.source }}
          path: ${{ runner.temp }}/aml339/recovery_*.json
          if-no-files-found: error
          retention-days: 30
  report:
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: aml339-recovery-*
          path: evidence
      - run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in Path("evidence").rglob("recovery_*.json")]
          assert len(rows)==len({x["id"] for x in rows})==15
          print("RECOVERY_BATCH_TOTAL",json.dumps({"verified":[x["id"] for x in rows if x["verified"]],"failed":[x["id"] for x in rows if not x["verified"]]}),flush=True)
          Path("recovery_summary.json").write_text(json.dumps(rows,ensure_ascii=False,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aml339-recovery-summary
          path: recovery_summary.json
          retention-days: 30
