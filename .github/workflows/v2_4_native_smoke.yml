name: Radar v2.4 native ATS verification smoke

on:
  push:
    branches: ["feat/v2-4-native-ats-application-proof"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m compileall -q radar.py job_radar tests
      - name: Run all regression tests
        run: python -m unittest discover -s tests -v
      - name: Check deduplication baseline before smoke
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("data/state.json").read_text())
          assert len(state["seen"]) >= 305, "Historical dedupe ledger unexpectedly shrank"
          print("Historical dedupe entries:",len(state["seen"]))
          PY
      - name: Isolated live source scan (no production commit)
        run: python radar.py scan
      - name: Inspect funnel and outputs
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/quality_audit.json")
          if p.exists():
              a=json.loads(p.read_text())
              print("QUALITY_FUNNEL",json.dumps({
                  k:v for k,v in a.items() if not isinstance(v,list)
              },ensure_ascii=False))
              assert a["official_apply_page_verified"] <= a["prefiltered_candidates"]
          for path in ["public/index.html","public/review.html",
                       "public/status.html","public/sources.html",
                       "public/feed.xml"]:
              print("OUTPUT",path,Path(path).exists())
              assert Path(path).exists()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-4-native-ats-isolated-smoke
          path: |
            data/quality_audit.json
            data/health.json
            public/status.json
            public/sources.json
          if-no-files-found: warn
