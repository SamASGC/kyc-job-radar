name: v3.28 N26 official ATS and honest source-health full acceptance
on:
  push:
    branches: ["feat/v3-28-repair-official-ats-and-errors"]
    paths: [".github/workflows/v3_28_full_acceptance.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12",cache: pip}
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile, regression suite and adversarial N26 spoofing tests
        run: |
          python -m compileall -q radar.py job_radar tests
          python -m unittest discover -s tests -v
      - name: Scan every registered employer, source and provider
        run: python radar.py scan
      - name: Refuse history loss, catastrophic source failure or unsupported apply
        run: |
          git show HEAD:data/state.json > /tmp/v328-baseline.json
          python -m job_radar.production_guard --prior /tmp/v328-baseline.json
      - name: Validate 500 direct employers, 194 ATS, no unscanned and diagnostics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          firms=[]
          for p in ("config/companies.json","config/extra_companies.json"):
            firms+=json.loads(Path(p).read_text(encoding="utf-8"))
          c={x["name"]:x for x in firms}
          state=json.loads(Path("data/state.json").read_text(encoding="utf-8"))
          report=json.loads(Path("public/sources.json").read_text(encoding="utf-8"))
          audit=json.loads(Path("data/quality_audit.json").read_text(encoding="utf-8"))
          assert len(firms)==len(c)==500
          assert c["N26"]["ats"]==[{"kind":"greenhouse","slug":"n26"}]
          assert c["N26"]["verification_level"]=="official_ats_live_probe_passed"
          assert report["direct_configured"]==500 and report["ats_explicit"]==194
          assert report["direct_not_checked"]==0
          assert report["direct_with_records"]>=280
          assert report["direct_errors"]<=120
          assert isinstance(report["direct_degraded"],int)
          assert len(state["seen"])>=314
          assert audit["official_apply_page_verified"]==audit["verified_score_accepted"]+audit["verified_score_rejected"]
          assert all(x.get("apply_verified_at") and x.get("posted_at") for x in state["jobs"].values())
          print("V328_COUNTS",json.dumps({k:report.get(k) for k in ("direct_configured","ats_explicit","direct_with_records","direct_errors","direct_degraded","direct_reachable_zero","direct_not_checked")}))
          print("V328_AUDIT",json.dumps({k:v for k,v in audit.items() if not isinstance(v,list)}))
          print("V328_STATE",json.dumps({"active":len(state["jobs"]),"seen":len(state["seen"]),"stats":state.get("stats")}))
          print("V328_JOBS",json.dumps([{"company":v["company"],"title":v["title"],"loc":v["location"],"original":v["posted_at"],"url":v["apply_url"]} for v in state["jobs"].values()]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-28-source-health-and-recall
          path: |
            public/sources.json
            public/recall.json
            data/quality_audit.json
          if-no-files-found: warn
