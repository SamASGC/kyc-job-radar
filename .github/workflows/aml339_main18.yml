          set -euo pipefail
          echo 'e8a08263115c4bbbaf02d4a4ae59431a7e4b16a0a7c79e339ff2f53ef9aadc02  experiments/aml339/full_original_339_sources.zip' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/aml339/experiments/aml339"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("experiments/aml339/full_original_339_sources.zip") as z:
              allowed={"amlradar/__init__.py","amlradar/model.py","amlradar/net.py",
                       "amlradar/employer_links.py","amlradar/sources.py","fuentes.json",
                       "VALIDAR_REAL_SIN_TOCAR_DATOS.py"}
              assert set(z.namelist())==allowed
              assert sum(f.file_size for f in z.infolist())<800_000
              assert all(not x.filename.startswith("/") and ".." not in Path(x.filename).parts for x in z.infolist())
              z.extractall(Path(os.environ["RUNNER_TEMP"])/"aml339")
          PY
          cp experiments/aml339/{repair_sources_20261121.py,quality_audit.py,live_e2e18_full.py,two_lane_alert_preview.py,live_reg100_pilot.py,live_reg100_active.py} "$RUNNER_TEMP/aml339/"
          cp experiments/aml339/regulator100_discovery_queue.json "$RUNNER_TEMP/aml339/experiments/aml339/"
          cd "$RUNNER_TEMP/aml339"
          python3 repair_sources_20261121.py
          python3 quality_audit.py --self-test
      - name: Audit official listings, positive baseline and relevant complete job applications
        shell: bash
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aml339"
          python3 "$GITHUB_WORKSPACE/experiments/aml339/hourly_http_guard.py" run --prior "$RUNNER_TEMP/aml339-cooldown/prior.json" --receipt "$RUNNER_TEMP/aml339/http_pause_${SOURCE}.json" live_reg100_active.py --source "$SOURCE" --minutes 4 --out "candidate_${SOURCE}.json"
      - name: Preserve actual per-source report including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aml339-reg100-live-${{ matrix.source }}
          path: |
            ${{ runner.temp }}/aml339/candidate_*.json
            ${{ runner.temp }}/aml339/http_pause_*.json
          retention-days: 14
          if-no-files-found: warn

  prepare_external:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    outputs:
      matrix: ${{ steps.registry.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - id: registry
        run: echo "matrix=$(python3 experiments/aml339/external_live_registry.py)" >> "$GITHUB_OUTPUT"

  external50_live:
    needs: [prepare_external, prepare_cooldowns]
    name: Verify dynamically enrolled employer ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    # Optional provider failure is recorded per-source; publication may proceed.
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare_external.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: aml339-http-cooldown-prior
          path: ${{ runner.temp }}/aml339-cooldown
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify original 339 archive and unpack isolated, read-only parser
        shell: bash
        run: |
          set -euo pipefail
          echo 'e8a08263115c4bbbaf02d4a4ae59431a7e4b16a0a7c79e339ff2f53ef9aadc02  experiments/aml339/full_original_339_sources.zip' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/aml339/experiments/aml339"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("experiments/aml339/full_original_339_sources.zip") as z:
              allowed={"amlradar/__init__.py","amlradar/model.py","amlradar/net.py",
                       "amlradar/employer_links.py","amlradar/sources.py","fuentes.json",
                       "VALIDAR_REAL_SIN_TOCAR_DATOS.py"}
              assert set(z.namelist())==allowed
              assert sum(f.file_size for f in z.infolist())<800_000
              assert all(not x.filename.startswith("/") and ".." not in Path(x.filename).parts for x in z.infolist())
              z.extractall(Path(os.environ["RUNNER_TEMP"])/"aml339")
          PY
          cp experiments/aml339/{repair_sources_20261121.py,quality_audit.py,live_e2e18_full.py,two_lane_alert_preview.py,live_external50_wave02.py,live_external50_next.py,live_external_generic.py,external_live_registry.py,external_live_registry.json,live_catalog_registry.py} "$RUNNER_TEMP/aml339/"
          cp experiments/aml339/external_regulated50_wave02.json "$RUNNER_TEMP/aml339/experiments/aml339/"
          cd "$RUNNER_TEMP/aml339"
          python3 repair_sources_20261121.py
          python3 quality_audit.py --self-test
      - name: Audit official listings, positive baseline and relevant complete job applications
        shell: bash
        env:
          SOURCE: ${{ matrix.source }}
          DRIVER: ${{ matrix.driver }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aml339"
          if [[ "$DRIVER" == "next" ]]; then
            python3 "$GITHUB_WORKSPACE/experiments/aml339/hourly_http_guard.py" run --prior "$RUNNER_TEMP/aml339-cooldown/prior.json" --receipt "$RUNNER_TEMP/aml339/http_pause_${SOURCE}.json" live_external50_next.py --source "$SOURCE" --production --out "candidate_${SOURCE}.json"
          elif [[ "$DRIVER" == "wave02" ]]; then
            python3 "$GITHUB_WORKSPACE/experiments/aml339/hourly_http_guard.py" run --prior "$RUNNER_TEMP/aml339-cooldown/prior.json" --receipt "$RUNNER_TEMP/aml339/http_pause_${SOURCE}.json" live_external50_wave02.py --source "$SOURCE" --production --out "candidate_${SOURCE}.json"
          elif [[ "$DRIVER" == "generic" ]]; then
            python3 "$GITHUB_WORKSPACE/experiments/aml339/hourly_http_guard.py" run --prior "$RUNNER_TEMP/aml339-cooldown/prior.json" --receipt "$RUNNER_TEMP/aml339/http_pause_${SOURCE}.json" live_external_generic.py --source "$SOURCE" --production --out "candidate_${SOURCE}.json"
          elif [[ "$DRIVER" == "catalog" ]]; then
            python3 "$GITHUB_WORKSPACE/experiments/aml339/hourly_http_guard.py" run --prior "$RUNNER_TEMP/aml339-cooldown/prior.json" --receipt "$RUNNER_TEMP/aml339/http_pause_${SOURCE}.json" live_catalog_registry.py --source "$SOURCE" --out "candidate_${SOURCE}.json"
          else
            exit 1
          fi
      - name: Preserve actual per-source report including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aml339-external50-live-${{ matrix.source }}
          path: |
            ${{ runner.temp }}/aml339/candidate_*.json
            ${{ runner.temp }}/aml339/http_pause_*.json
          retention-days: 14
          if-no-files-found: warn

  persist_cooldowns:
    needs: [prepare_cooldowns, scan, expansion, regulated, wave50, growth50, regulator50, reg100_live, external50_live]
    if: ${{ always() && needs.prepare_cooldowns.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/download-artifact@v4
        with:
          pattern: aml339-*
          path: cooldown-evidence
      - name: Persist longest observed provider pauses even if a source audit failed
        run: |
          set -euo pipefail
          python3 experiments/aml339/hourly_http_guard.py merge --prior data/aml339_http_cooldowns.json --receipts cooldown-evidence --out data/aml339_http_cooldowns.json
          git config user.name "kyc-radar-bot"
          git config user.email "kyc-radar-bot@users.noreply.github.com"
          git add data/aml339_http_cooldowns.json
          if ! git diff --cached --quiet; then
            git commit -m "aml339: persist HTTP provider pauses [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  publish:
    name: Audit complete scan, preserve history and publish independent page
    needs: [scan, expansion, regulated, wave50, growth50, regulator50, reg100_live, external50_live, persist_cooldowns]
    # Preserve 17 strictly mandatory independent sources; the Payabl Workable provider is quarantinable.
    if: ${{ always() && needs.scan.result == 'success' && needs.persist_cooldowns.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the two-lane rules, previous state policy and site
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_aml339_*.py' -v
          python3 experiments/aml339/alert_history.py --self-test
      - name: Retrieve ALL 18 live official source reports
        uses: actions/download-artifact@v4
        with:
          pattern: aml339-main18-source-*
          path: sources
      - name: Retrieve OPTIONAL new source reports without risking the core
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: aml339-expansion-source-*
          path: extras
      - name: Retrieve NEW regulated EMI source reports (independent of 339 source archive)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: aml339-regulated-source-*
          path: extras
      - name: Retrieve BULK 50 additional employer audits without risking original core
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: aml339-wave50-source-*
          path: extras
      - name: Retrieve genuinely NEW regulated-company ATS reports (two proven live)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: aml339-regulator50-live-source-*
          path: extras
      - name: Retrieve two additionally verified regulator100 official ATS sources
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: aml339-reg100-live-*
          path: extras
      - name: Retrieve SECOND 50 verified official employer portals, each individually optional
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: aml339-growth50-live-source-*
          path: extras
      - name: Retrieve external50 live evidence (three independently audited portals)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: aml339-external50-live-*
          path: extras
      - name: Verify core 18 and accept only fully audited optional sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extras
          python3 scripts/aml339_source_manifest.py \
            --core-dir sources --expansion-dir extras \
            --paths-out source_paths.txt --ids-out source_ids.txt \
            --manifest-out coverage_manifest.json
      - name: Reject a silent history reset when main state is unexpectedly absent
        if: ${{ hashFiles('data/aml339_main18_state.json') == '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Missing state is allowed ONLY for the first deployment. If any
          # earlier main18 workflow completed, do not fall back to the seed.
          python3 - <<'PY'
          import json,os,urllib.request
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/aml339_main18.yml/runs?status=success&per_page=5"
          req=urllib.request.Request(url,headers={
             "Authorization":"Bearer "+os.environ["GH_TOKEN"],
             "Accept":"application/vnd.github+json",
             "User-Agent":"AML339-safe-bootstrap"})
          with urllib.request.urlopen(req,timeout=20) as resp:
             data=json.load(resp)
          if not isinstance(data.get("total_count"),int):
             raise RuntimeError("Cannot inspect prior successful main runs")
          if data["total_count"]:
             raise RuntimeError("Missing existing AML339 state after prior successful execution: NO RESET")
          print("AML339_INITIAL_BOOTSTRAP_ALLOWED",flush=True)
          PY
      - name: First run only - fetch exact previously audited 3-record state
        if: ${{ hashFiles('data/aml339_main18_state.json') == '' }}
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: 45200484405
          github-token: ${{ github.token }}
          name: aml339-live18-full-state
          path: restored
      - name: Validate existing state or exact historical seed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p restored
          if test -s data/aml339_main18_state.json; then
            cp data/aml339_main18_state.json restored/history.json
            echo "AML339_RESTORED_FROM_MAIN"
          else
            test -s restored/isolated_alert_history.json
            cp restored/isolated_alert_history.json restored/history.json
            echo "AML339_RESTORED_FROM_VERIFIED_EXPERIMENT"
          fi
          python3 - <<'PY'
          import sys,json
          sys.path.insert(0,"experiments/aml339")
          from alert_history import check_history
          s=check_history(json.load(open("restored/history.json",encoding="utf-8")))
          if len(s["records"])<3:raise RuntimeError("Historic pilot records lost; refusing reset")
          print("AML339_HISTORY_VALIDATED",len(s["records"]),flush=True)
          PY
      - name: Evaluate both lanes, verify no duplicates or history loss
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports state
          mapfile -t files < source_paths.txt
          python3 experiments/aml339/alert_history.py \
            --expect-sources "$(cat source_ids.txt)" \
            --state-in restored/history.json --run-id "$GITHUB_RUN_ID" --strict-novelty \
            --state-out state/isolated_alert_history.json \
            --json-out reports/alerts.json --md-out reports/alerts.md "${files[@]}"
          python3 experiments/aml339/alert_history.py \
            --expect-sources "$(cat source_ids.txt)" \
            --state-in state/isolated_alert_history.json --strict-novelty \
            --state-out state/replay.json \
            --json-out reports/replay_alerts.json --md-out reports/replay_alerts.md "${files[@]}"
          python3 - <<'PY'
          import json
          prior=json.load(open("restored/history.json"))
          now=json.load(open("state/isolated_alert_history.json"))
          current=json.load(open("reports/alerts.json"))
          replay=json.load(open("reports/replay_alerts.json"))
          if not set(prior["records"]).issubset(now["records"]):
             raise RuntimeError("Historical alert keys lost")
          coverage=json.load(open("coverage_manifest.json"))
          if (current["source_count"]!=coverage["total_verified"]
              or coverage["core_verified"] not in (17,18)
              or coverage.get("strict_core_verified")!=17
              or set(coverage.get("missing_or_failed_core",{})) != (
                  {"payabl"} if coverage["core_verified"]==17 else set())
              or replay["new_counts"]!={"confirmed_recent":0,"promising_date_unconfirmed":0}):
             raise RuntimeError("Incomplete core source audit or duplicate alerts on replay")
          print("AML339_CONTINUITY_AND_NO_REPEAT_PASSED",json.dumps({
            "previous_records":len(prior["records"]),"final_records":len(now["records"]),
            "new":current["new_counts"],"replay":replay["new_counts"]}),flush=True)
          PY
      - name: Build SEPARATE AML339 web view and RSS, preserving 500-employer radar
        shell: bash
        run: |
          set -euo pipefail
          cp state/isolated_alert_history.json data/aml339_main18_state.json
          python3 scripts/aml339_site.py \
            --sources-file source_paths.txt \
            --state-file data/aml339_main18_state.json \
            --report-file reports/alerts.json \
            --manifest-file coverage_manifest.json \
            --dest public/aml339
          test -s public/index.html
          test -s public/feed.xml
          test -s public/aml339/index.html
          test -s public/aml339/confirmed.xml
          test -s public/aml339/review.xml
      - name: Commit atomic AML339 history + view only after every check passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kyc-radar-bot"
          git config user.email "kyc-radar-bot@users.noreply.github.com"
          git add data/aml339_main18_state.json public/aml339/
          if git diff --cached --quiet; then
            echo "AML339_NO_CHANGES"
          else
            git commit -m "aml339: publish guarded 18-plus verified expansion [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve complete alert audit for troubleshooting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aml339-main18-audit
          path: |
            reports/
            source_paths.txt
            source_ids.txt
            coverage_manifest.json
          retention-days: 30
          if-no-files-found: warn
      - name: Upload full GitHub Pages site including original radar
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Wait until the uploaded Pages artifact is visible through the API
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/aml339_pages_ready.py
      - name: Deploy both dashboards without replacing existing radar
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      # GitHub's upload API can report the artifact before deploy-pages indexes it.
      # This retry is ONLY for publication; it does not rerun a job scan or touch history.
      - name: Allow GitHub Pages artifact propagation if first deploy failed
        if: ${{ steps.deployment.outcome == 'failure' }}
        run: sleep 35
      - name: Retry Pages deployment once after propagation
        if: ${{ steps.deployment.outcome == 'failure' }}
        id: deployment_retry
        uses: actions/deploy-pages@v5
