name: AML339 V1 regulated source radar (original core and audited optional source registry)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/aml339_main18.yml"
      - "experiments/aml339/**"
      - "scripts/aml339_site.py"
      - "tests/test_aml339_publication.py"
      - "tests/test_aml339_expansion_manifest.py"
      - "tests/test_aml339_26_end_to_end.py"
      - "tests/test_aml339_bridge_duties.py"
      - "tests/test_aml339_true_novelty.py"
      - "scripts/aml339_source_manifest.py"
      - "experiments/aml339/live_regulated_sidecar.py"
      - "tests/test_aml339_regulated_sidecars.py"
      - "tests/test_aml339_bulk50.py"
      - "experiments/aml339/probe_malta_three_new.py"
      - "tests/test_aml339_extra_malta.py"
      - "experiments/aml339/batch50_sources.py"
      - "experiments/aml339/live_batch50_probe.py"
      - "experiments/aml339/regulator50_external_candidates.json"
      - "experiments/aml339/live_regulator50_canary.py"
      - "tests/test_aml339_regulator50.py"
      - "experiments/aml339/live_reg100_pilot.py"
      - "experiments/aml339/live_reg100_active.py"
      - "tests/test_aml339_reg100_live.py"
      - "experiments/aml339/growth_wave50_sources.py"
      - "experiments/aml339/live_growth50_probe.py"
      - "tests/test_aml339_growth50.py"
      - "scripts/aml339_pages_ready.py"
  schedule:
    # Hourly production scans, with a separate daily slot for Workable/Payabl.
    - cron: "23 0-6,8-23 * * *"
    - cron: "23 7 * * *"

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

# This matches the EXISTING production radar concurrency group. Prevents
# simultaneous writes or competing deployments of the same GitHub Pages site.
concurrency:
  group: kyc-job-radar-hourly
  cancel-in-progress: false

jobs:
  prepare_cooldowns:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - name: Load latest persistent provider pause ledger
        run: |
          mkdir -p cooldown
          python3 experiments/aml339/hourly_http_guard.py merge --prior data/aml339_http_cooldowns.json --receipts cooldown --out cooldown/prior.json
      - uses: actions/upload-artifact@v4
        with:
          name: aml339-http-cooldown-prior
          path: cooldown/prior.json
          retention-days: 2
  scan:
    needs: prepare_cooldowns
    name: Verify ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    # Workable can block Payabl for >13h. This one provider cannot block all
    # other AML339 alerts; its failed report is quarantined, not invented.
    continue-on-error: ${{ matrix.source == 'payabl' }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        source: [vinted, verifo-lithuania, demivolt-lithuania, lt-neo-finance, swedbank, luminor, n26, wise, corpay, openpayd, transfergo, bvnk, bnf-bank-malta, medirect-bank-malta, payabl, airwallex, mollie, truelayer]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aml339-http-cooldown-prior
          path: ${{ runner.temp }}/aml339-cooldown
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pinned 339-source archive and extract to temporary workspace
        shell: bash
        run: |
          set -euo pipefail
          echo 'e8a08263115c4bbbaf02d4a4ae59431a7e4b16a0a7c79e339ff2f53ef9aadc02  experiments/aml339/full_original_339_sources.zip' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/aml339"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os
          with ZipFile('experiments/aml339/full_original_339_sources.zip') as z:
              allowed={"amlradar/__init__.py","amlradar/model.py","amlradar/net.py",
                       "amlradar/employer_links.py","amlradar/sources.py","fuentes.json",
                       "VALIDAR_REAL_SIN_TOCAR_DATOS.py"}
              assert set(z.namelist())==allowed
              assert sum(f.file_size for f in z.infolist())<800_000
              assert all(not x.filename.startswith('/') and '..' not in Path(x.filename).parts for x in z.infolist())
              z.extractall(Path(os.environ["RUNNER_TEMP"])/"aml339")
          PY
          cp experiments/aml339/{repair_sources_20261121.py,quality_audit.py,live_e2e18_full.py,two_lane_alert_preview.py} "$RUNNER_TEMP/aml339/"
          cd "$RUNNER_TEMP/aml339"
          python3 repair_sources_20261121.py
          python3 quality_audit.py --self-test
      - name: Fetch current official vacancies and verify relevant job details
        shell: bash
        env:
          SOURCE: ${{ matrix.source }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aml339"
          if [[ "$SOURCE" == "payabl" && "$EVENT_SCHEDULE" != "23 7 * * *" ]]; then
            echo "Payabl reserved for daily scheduled audit; no network request"
            exit 0
          fi
          python3 "$GITHUB_WORKSPACE/experiments/aml339/hourly_http_guard.py" run --prior "$RUNNER_TEMP/aml339-cooldown/prior.json" --receipt "$RUNNER_TEMP/aml339/http_pause_${SOURCE}.json" live_e2e18_full.py --source "$SOURCE" --minutes 4 --out "source_${SOURCE}.json"
      - name: Always retain source-level evidence for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aml339-main18-source-${{ matrix.source }}
          path: |
            ${{ runner.temp }}/aml339/source_*.json
            ${{ runner.temp }}/aml339/http_pause_*.json
          retention-days: 14
          if-no-files-found: warn

  expansion:
    needs: prepare_cooldowns
    name: Verify added ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    # Optional provider failure is recorded per-source; publication may proceed.
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: [iq-eq, aztec-group, ebury, nexpay, nium, keyrock, mirabaud, convera, complyadvantage, hawk, clearbank, modulr, lemonway, ecommpay, crossmint, moonpay, genome, wallester, bybit, zilch]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: aml339-http-cooldown-prior
          path: ${{ runner.temp }}/aml339-cooldown
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pinned 339-source archive and extract to temporary workspace
        shell: bash
        run: |
          set -euo pipefail
          echo 'e8a08263115c4bbbaf02d4a4ae59431a7e4b16a0a7c79e339ff2f53ef9aadc02  experiments/aml339/full_original_339_sources.zip' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/aml339"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os
          with ZipFile('experiments/aml339/full_original_339_sources.zip') as z:
              allowed={"amlradar/__init__.py","amlradar/model.py","amlradar/net.py",
                       "amlradar/employer_links.py","amlradar/sources.py","fuentes.json",
                       "VALIDAR_REAL_SIN_TOCAR_DATOS.py"}
              assert set(z.namelist())==allowed
              assert sum(f.file_size for f in z.infolist())<800_000
              assert all(not x.filename.startswith('/') and '..' not in Path(x.filename).parts for x in z.infolist())
              z.extractall(Path(os.environ["RUNNER_TEMP"])/"aml339")
          PY
          cp experiments/aml339/{repair_sources_20261121.py,quality_audit.py,live_e2e18_full.py,two_lane_alert_preview.py,live_expansion_probe.py} "$RUNNER_TEMP/aml339/"
          cd "$RUNNER_TEMP/aml339"
          python3 repair_sources_20261121.py
          python3 quality_audit.py --self-test
      - name: Fetch current official vacancies and verify relevant job details
        shell: bash
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aml339"
          python3 "$GITHUB_WORKSPACE/experiments/aml339/hourly_http_guard.py" run --prior "$RUNNER_TEMP/aml339-cooldown/prior.json" --receipt "$RUNNER_TEMP/aml339/http_pause_${SOURCE}.json" live_expansion_probe.py --source "$SOURCE" --minutes 4 --out "candidate_${SOURCE}.json"
      - name: Always retain source-level evidence for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aml339-expansion-source-${{ matrix.source }}
          path: |
            ${{ runner.temp }}/aml339/candidate_*.json
            ${{ runner.temp }}/aml339/http_pause_*.json
          retention-days: 14
          if-no-files-found: warn

  regulated:
