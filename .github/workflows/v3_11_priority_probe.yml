name: v3.11 - high priority first party career feed probe
on:
  push:
    branches: ["fix/v3-11-priority-source-reliability"]
    paths: [".github/workflows/v3_11_priority_probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Probe attributable first-party feeds without bypassing security restrictions
        run: |
          python - <<'PY'
          import asyncio,json
          from bs4 import BeautifulSoup
          from job_radar.http import Http
          from job_radar.sources.oracle_hcm import fetch_oracle_hcm
          from job_radar.sources.workday import fetch_workday
          from job_radar.sources.generic import fetch_generic
          from job_radar.discovery import generic_job_links, detect_ats
          EU="https://don.fa.em2.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_1003/jobs"
          SF="https://shift4payments.wd108.myworkdayjobs.com/Shift4_External_CareerSite"
          SITE={
            "Revolut official":"https://www.revolut.com/careers/",
            "Revolut roles":"https://www.revolut.com/careers/positions/",
            "PayDo current official":"https://paydo.com/career/",
            "Kutxabank official":"https://www.kutxabanktalent.com/es/",
            "Kutxabank group":"https://portal.kutxabank.es/cs/Satellite/kb/es/particulares",
            "Schaffhauser JS":"https://jobs.shkb.ch/de/jobportal",
            "SwissPrime jobs":"https://jobs.sps.swiss/job-overview/search",
            "BEKB embedded":"https://ohws.prospective.ch/public/v2/careercenter/1509/?lang=de",
          }
          async def main():
            http=Http(concurrency=10,timeout=14)
            async def one(name,fn):
              try:
                ans=await asyncio.wait_for(fn(),timeout=75)
                jobs=ans[0] if isinstance(ans,tuple) else ans
                sample=[{"title":j.title,"url":j.apply_url[:160],"posted":j.posted_at} for j in jobs[:3]]
                print("RECOVERY_API",json.dumps({"name":name,"ok":True,"count":len(jobs),"sample":sample},ensure_ascii=False),flush=True)
              except Exception as e:
                print("RECOVERY_API",json.dumps({"name":name,"ok":False,"error":type(e).__name__+": "+str(e)[:175]},ensure_ascii=False),flush=True)
            api=[
              ("Euroclear Oracle",lambda:fetch_oracle_hcm(http,{"name":"Euroclear","sector":"Banca","careers_url":EU},{"kind":"oracle_hcm","site":"CX_1003","language":"en","url":EU})),
              ("Shift4 Workday",lambda:fetch_workday(http,{"name":"Shift4","sector":"Payments","careers_url":SF},SF)),
              ("PayDo first party",lambda:fetch_generic(http,{"name":"PayDo","sector":"Payments","careers_url":SITE["PayDo current official"]})),
            ]
            await asyncio.gather(*(one(n,f) for n,f in api))
            async def page(name,url):
              try:
                r=await http.get(url)
                soup=BeautifulSoup(r.text,"html.parser")
                links=generic_job_links(r.text,str(r.url))
                frames=[q.get("src") for q in soup.select("iframe[src]")][:4]
                print("RECOVERY_PAGE",json.dumps({"name":name,"status":r.status_code,
                  "url":str(r.url),"bytes":len(r.content),"job_links":len(links),
                  "job_samples":links[:3],"iframes":frames,
                  "script_src":[p.get("src","")[:120] for p in soup.select("script[src]")][-4:],
                  "ats":detect_ats(r.text,str(r.url))[:3]},ensure_ascii=False),flush=True)
              except Exception as e:
                print("RECOVERY_PAGE",json.dumps({"name":name,"error":type(e).__name__+": "+str(e)[:160]}),flush=True)
            await asyncio.gather(*(page(n,u) for n,u in SITE.items()))
            await http.close()
          asyncio.run(main())
          PY
