name: Live first-party careers scan for small licensed employers
on:
  push:
    branches: [feat/aml339-regulated-watch]
    paths: [.github/workflows/aml339_channel_probe.yml]
permissions:
  contents: read
jobs:
  channels:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Get official recruitment pages and their supported ATS links
        run: |
          mkdir -p markup
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import json, pathlib, sys, urllib.request as req
          from urllib.parse import urlsplit
          def honor(event,args):
              if event=='urllib.Request' and (urlsplit(args[0]).hostname or '').endswith('workable.com'):
                  raise RuntimeError('Retry interval active')
          sys.addaudithook(honor)
          urls={"embank":"https://em.bank/career/","finora":"https://finorabank.eu/careers/","urbo":"https://urbo.lt/en/career","connectpay":"https://connectpay.com/about-us/","okeo":"https://join.okeo.com/","truevo":"https://truevo.com/careers/","moneybase":"https://moneybase.com/careers","lombard":"https://www.lombardmalta.com/en/vacancies-available","bov":"https://www.bov.com/careers","sogexia":"https://careers.sogexia.com/jobs","bankingcircle":"https://www.bankingcircle.com/careers","quintet":"https://www.quintet.lu/en-lu/jobs","raiffeisen":"https://www.raiffeisen.lu/en/banque/career","luxhub":"https://luxhub.com/careers","pecunpay":"https://srv.pecunpay.es/career","cecabank":"https://www.cecabank.es/trabaja-con-nosotros/","bancamarch":"https://www.bancamarch.es/es/nosotros/trabaje-con-nosotros/","treezor":"https://www.treezor.com/company/careers/","myinvestor":"https://myinvestor.es/trabaja-con-nosotros/","holm":"https://www.holmbank.ee/en/about-holm/working-in-holm","paysera":"https://www.paysera.lt/v2/en-LT/career","breezyhtml":"https://paynovate.breezy.hr/","talentcoop":"https://www.cooppank.ee/en/careers","paymont":"https://www.paymont.eu/career/"}
          def fetch(pair):
              key,url=pair
              try:
                  with req.urlopen(req.Request(url,headers={'User-Agent':'AML339/1.0 (employer vacancy monitoring)'}),timeout=22) as r:
                      raw=r.read(2200001)
                      if len(raw)>2200000: raise ValueError('Page too large')
                      pathlib.Path('markup',key).write_bytes(raw)
                      print('CHANNEL',key,r.geturl(),len(raw),flush=True)
              except Exception as e: print('CHANNEL',key,'FAIL',str(e)[:95],flush=True)
          with ThreadPoolExecutor(max_workers=4) as pool: list(pool.map(fetch,urls.items()))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: named-employer-hiring-channels
          path: markup
          retention-days: 2
