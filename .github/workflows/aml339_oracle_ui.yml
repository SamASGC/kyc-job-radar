name: AML339 Oracle rendered UI pilot
on:
  pull_request:
    paths:
      - 'experiments/aml339/audit_oracle_ui.py'
      - '.github/workflows/aml339_oracle_ui.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        source: [danske-bank, csc, citco]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: current-main
          sparse-checkout: data/aml339_http_cooldowns.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned browser automation dependency
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Read public candidate UI only
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          python -m py_compile experiments/aml339/audit_oracle_ui.py
          python experiments/aml339/audit_oracle_ui.py --source "$SOURCE" --prior current-main/data/aml339_http_cooldowns.json --receipt "http_pause_$SOURCE.json" --out "oracle_$SOURCE.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aml339-oracle-ui-${{ matrix.source }}
          path: |
            oracle_*.json
            http_pause_*.json
          if-no-files-found: error
          retention-days: 30
  report:
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: aml339-oracle-ui-*
          path: evidence
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in Path("evidence").rglob("oracle_*.json")]
          assert len(rows)==3 and {r["id"] for r in rows}=={"danske-bank","csc","citco"}
          assert all(r["verified"] is False for r in rows)
          print("ORACLE_UI_SUMMARY",json.dumps([{k:v for k,v in r.items() if k not in ("listing_ids","audited")} for r in rows],ensure_ascii=False))
          PY
