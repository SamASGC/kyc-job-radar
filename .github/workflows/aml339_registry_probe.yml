name: Verify five country official payment service provider registers
on:
  push:
    branches: [feat/aml339-regulated-watch]
    paths: [.github/workflows/aml339_registry_probe.yml]
permissions:
  contents: read
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read ECB payment institution lists distributed by Banco de España
        run: |
          mkdir -p registers
          python - <<'PY'
          import csv,io,pathlib,urllib.request as req,time
          base='https://www.bde.es/webbe/en/estadisticas/otras-clasificaciones/clasificacion-entidades/listas-instituciones-financieras/listas-instituciones-relevantes-estadisticas-pago-pais/lista-psri-'
          for cc in ('es','lt','lu','mt','ee'):
              with req.urlopen(req.Request(base+cc+'.csv', headers={'User-Agent':'AML339/1.0 regulation and vacancies'}), timeout=25) as r:
                  raw=r.read(3000000)
              rows=list(csv.DictReader(line.rstrip() for line in raw.decode('utf-8-sig').splitlines() if line.strip()))
              if not rows or 'TYPE OF LICENCE' not in rows[0]: raise ValueError(cc+' registry schema')
              pathlib.Path('registers',cc+'.csv').write_bytes(raw)
              print('PROVIDERS',cc,len(rows),sum(x['TYPE OF LICENCE']=='Explicit' for x in rows))
              time.sleep(0.7)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: published-psp-registers
          path: registers
          retention-days: 3
