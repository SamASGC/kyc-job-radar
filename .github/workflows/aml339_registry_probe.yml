name: Check central bank exports and public labour-market schema
on:
  push:
    branches: [feat/aml339-regulated-watch]
    paths: [.github/workflows/aml339_registry_probe.yml]
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read published regulatory categories and public dataset metadata
        run: |
          mkdir -p snapshots
          python - <<'PY'
          import csv, io, json, pathlib, time, urllib.request as request, urllib.error, urllib.parse as up
          root='https://get.data.gov.lt/datasets/gov/uzt/ldv/Vieta'
          def get(url):
              headers={'User-Agent':'RegulatedJobRadar/1.0 public employment monitor','Accept':'*/*'}
              with request.urlopen(request.Request(url,headers=headers),timeout=25) as r:
                  return r.read(6_000_000)
          for name in ['namespace','model','row','resource','catalogue','category32','category33','category27','category28','category82','category110','category60','category23','category22','category45','category63']:
              try:
                  if name.startswith('category'):
                      form=name.removeprefix('category')
                      market='3' if form in ('60','63') else '1'
                      url='https://www.lb.lt/en/sfi-financial-market-participants?business_form='+form+'&market='+market+'&page=1&export=csv'
                      data=get(url)
                      pathlib.Path('snapshots',name+'.csv').write_bytes(data)
                      print(name,len(data),repr(data[:230]),flush=True)
                  else:
                      url={'row':root+'?limit(1)','model':root+'/:format/json?limit(1)','namespace':'https://get.data.gov.lt/datasets/gov/uzt/ldv/:ns','resource':'https://data.gov.lt/datasets/2894/models/','catalogue':'https://data.gov.lt/datasets/2894/dynamic-resource/ldv/'}[name]
                      data=get(url)
                      print(name,len(data),flush=True)
                      if name in ('row','model','namespace'):
                          parsed=json.loads(data)
                          rows=parsed.get('_data',[])
                          print(name,'keys',list(rows[0]) if rows else list(parsed),flush=True)
                          if rows: pathlib.Path('snapshots',name+'.json').write_text(json.dumps(sorted(rows[0])))
                      elif name=='resource': pathlib.Path('snapshots','resource.html').write_bytes(data)
              except urllib.error.HTTPError as exc:
                  print(name,'HTTP',exc.code,repr(exc.read(450)),flush=True)
              except Exception as exc:
                  print(name,'FAIL',str(exc)[:170],flush=True)
              time.sleep(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bank-categories-and-public-schema
          path: snapshots
          retention-days: 2
