name: v3.26 targeted diligence for newly recovered roles
on:
  push:
    branches: ["feat/v3-26-workday-first-party-date-and-recall"]
    paths: [".github/workflows/v3_26_workday_candidate_diligence.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Read verified requisition qualifications for seven recovered candidates
        run: |
          python - <<'PY'
          import asyncio,json,re
          from urllib.parse import urlsplit
          from bs4 import BeautifulSoup
          from job_radar.http import Http
          from job_radar.workday_detail import workday_board
          ROLES=[
            ("Western Union","https://westernunion.wd5.myworkdayjobs.com/WesternUnionJobs/job/LTU---Vilnius/Italian-speaking-Specialist--Anti-Money-Laundering-Compliance--Consumer-Monitoring-and-Investigation-_JR0131320-1"),
            ("Western Union","https://westernunion.wd5.myworkdayjobs.com/WesternUnionJobs/job/LTU---Vilnius/Specialist--AML-Compliance--Spanish-or-German--Portuguese--Italian-Speaker-_JR0131977-1"),
            ("Apex Group","https://theapexgroup.wd3.myworkdayjobs.com/apexgroupcareers/job/Munsbach-3-rue-Gabriel-Lippmann/Client-KYC-Officer--6-month-FTC-_JR-0025290"),
            ("Western Union","https://westernunion.wd5.myworkdayjobs.com/WesternUnionJobs/job/LTU---Vilnius/Specialist--Anti-Money-Laundering-Compliance--Consumer-Monitoring-and-Investigation----1-Year-Fixed-Term-Contract_JR0129809-1"),
            ("Western Union","https://westernunion.wd5.myworkdayjobs.com/WesternUnionJobs/job/LTU---Vilnius/French-speaking-Specialist--Anti-Money-Laundering-Compliance--Consumer-Monitoring-and-Investigation-_JR0132376-1"),
            ("Flywire","https://flywire.wd108.myworkdayjobs.com/flywirecareers/job/Vilnius-Lithuania/Compliance-Analyst--Financial-Crimes_JR-1035"),
            ("Western Union","https://westernunion.wd5.myworkdayjobs.com/WesternUnionJobs/job/LTU---Vilnius/Specialist--AML-Compliance--German-or-Spanish--Portuguese--Italian-Speaker-_JR0131981-1")
          ]
          async def run():
            h=Http(concurrency=7,timeout=22)
            try:
              async def one(company,url):
                p=urlsplit(url);b=workday_board(url.split("/job/")[0]);host,tenant,site,_=b
                path="/job/"+url.split("/job/",1)[1]
                api=f"https://{host}/wday/cxs/{tenant}/{site}{path}"
                try:
                  r=await h.get(api); info=(r.json() if r.status_code==200 else {}).get("jobPostingInfo") or {}
                  txt=BeautifulSoup(info.get("jobDescription") or "","html.parser").get_text("\n",strip=True)
                  lines=[re.sub(r"\s+"," ",q).strip() for q in txt.splitlines() if q.strip()]
                  clues=[q[:320] for q in lines if re.search(r"(?i)\b(year|experience|qualification|degree|bachelor|master|university|english|french|spanish|german|italian|portuguese|lithuanian|language|fluen|proficien|required|mandatory|investigat|screening|KYC|AML|transaction monitoring|source of funds|source of wealth|compliance|regulatory|education)\b",q)]
                  print("V326_ROLE_DILIGENCE",json.dumps({"company":company,"title":info.get("title"),"date":info.get("startDate"),"posted":info.get("posted"),"canApply":info.get("canApply"),"url":url,"reqs":clues[:36],"characters":len(txt)}))
                except Exception as e:
                  print("V326_ROLE_ERROR",json.dumps({"company":company,"url":url,"error":str(e)[:300]}))
              await asyncio.gather(*(one(n,u) for n,u in ROLES))
            finally: await h.close()
          asyncio.run(run())
          PY
