name: AML339 V1 read-only production release health
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/aml339_v1_status.py'
      - 'tests/test_aml339_v1_release.py'
      - '.github/workflows/aml339_v1_health.yml'
  push:
    branches: [main]
    paths:
      - ".github/workflows/aml339_v1_health.yml"
      - "scripts/aml339_v1_status.py"
      - "experiments/aml339/regulator100_discovery_queue.json"
  schedule:
    # Runs after the 07:23 UTC multi-source scan; no API or site writes.
    - cron: "40 8 * * *"
permissions:
  contents: read
jobs:
  audit-published:
    name: Check actual public V1 verified source coverage and immutable discovery queue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release health contract
        run: python3 -m unittest discover -s tests -p test_aml339_v1_release.py -v
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: main
          path: published-main
          persist-credentials: false
          sparse-checkout: public/aml339
          sparse-checkout-cone-mode: false
      - name: Check current public release including Windows desktop and both RSS feeds
        run: |
          summary=public/aml339/summary.json
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            summary=published-main/public/aml339/summary.json
          fi
          python3 scripts/aml339_v1_status.py --summary "$summary" --out v1_status.json --require-live
      - name: Retain honest status even on an incomplete or stale scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aml339-v1-readiness-check
          path: v1_status.json
          retention-days: 14
          if-no-files-found: warn
