name: v3.13 - priority blocked bank and fund servicer diagnostics
on:
  push:
    branches: ["fix/v3-13-targeted-employer-source-health"]
    paths: [".github/workflows/v3_13_target_probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Probe first party public career sites without bypassing access restrictions
        run: |
          python - <<'PY'
          import asyncio,json,re
          from bs4 import BeautifulSoup
          from job_radar.http import Http
          from job_radar.discovery import generic_job_links,detect_ats
          S={
            "IQ-EQ old":"https://iqeq.com/careers/vacancies/",
            "IQ-EQ careers":"https://iqeq.com/careers/",
            "IQ-EQ Luxembourg":"https://iqeq.com/careers/locations/luxembourg/",
            "NatWest old":"https://jobs.natwestgroup.com/search/natwest-group/jobs",
            "NatWest search":"https://jobs.natwestgroup.com/search/jobs",
            "NatWest Luxembourg":"https://jobs.natwestgroup.com/search/luxembourg/jobs",
            "Rabobank old":"https://rabobank.jobs/en/jobs/?job_branch%5B%5D=cdd",
            "Rabobank fresh":"https://rabobank.jobs/en/jobs/",
            "Rabobank FEC":"https://rabobank.jobs/en/expertise/financial-economic-crime/",
            "JTC jobs":"https://www.jtcgroup.com/jobs/",
            "JTC careers":"https://www.jtcgroup.com/careers/",
            "BEKB current":"https://www.bekb.ch/de/die-bekb/arbeitgeberin/stellen",
            "Schaffhausen jobs":"https://jobs.shkb.ch/de/jobportal",
            "SME Lithuanian":"https://smebank.lt/karjera/",
            "SwissPrime public":"https://jobs.sps.swiss/de",
            "Bankinter careers":"https://www.bankinter.com/webcorporativa/informacion-corporativa/sobre-bankinter/trabaja-con-nosotros",
            "Revolut newjobs":"https://www.revolut.com/careers/positions/"
          }
          async def main():
            http=Http(concurrency=6,timeout=13)
            sem=asyncio.Semaphore(7)
            async def check(name,url):
              async with sem:
                try:
                  r=await http.get(url)
                  body=r.text
                  soup=BeautifulSoup(body,"html.parser")
                  links=generic_job_links(body,str(r.url))
                  links=[{"title":x.get("title","")[:60],"url":x.get("url","")[:140]} for x in links[:4]]
                  frames=[(x.get("src") or "")[:170] for x in soup.select("iframe[src]")][:3]
                  scripts=[(x.get("src") or "")[:130] for x in soup.select("script[src]")][-4:]
                  print("EMPLOYER_SITE",json.dumps({"name":name,"status":r.status_code,
                    "final":str(r.url),"bytes":len(r.content),"links":len(generic_job_links(body,str(r.url))),
                    "samples":links,"frames":frames,"scripts":scripts,
                    "title":soup.title.get_text(" ",strip=True)[:100] if soup.title else ""},ensure_ascii=False),flush=True)
                except Exception as e:
                  print("EMPLOYER_SITE",json.dumps({"name":name,"error":type(e).__name__+": "+str(e)[:170]}),flush=True)
            await asyncio.gather(*(check(n,u) for n,u in S.items()))
            await http.close()
          asyncio.run(main())
          PY
