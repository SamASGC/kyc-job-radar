name: AML339 outside-339 regulated EMI live pilot
on:
  push:
    branches: [feat/aml339-external-emi-zen-trumia-20261123]
    paths: [".github/workflows/aml339_regulated_sidecar_canary.yml","experiments/aml339/live_regulated_sidecar.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Verify official ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: [emi-trumia-mt, emi-zen-lt]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify immutable original parser and prepare isolated sidecar
        shell: bash
        run: |
          set -euo pipefail
          echo 'e8a08263115c4bbbaf02d4a4ae59431a7e4b16a0a7c79e339ff2f53ef9aadc02  experiments/aml339/full_original_339_sources.zip' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/aml339"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os
          with ZipFile("experiments/aml339/full_original_339_sources.zip") as z:
              allowed={"amlradar/__init__.py","amlradar/model.py","amlradar/net.py",
                       "amlradar/employer_links.py","amlradar/sources.py","fuentes.json",
                       "VALIDAR_REAL_SIN_TOCAR_DATOS.py"}
              assert set(z.namelist())==allowed and sum(x.file_size for x in z.infolist())<800_000
              assert all(not x.filename.startswith("/") and ".." not in Path(x.filename).parts for x in z.infolist())
              z.extractall(Path(os.environ["RUNNER_TEMP"])/"aml339")
          PY
          cp experiments/aml339/{repair_sources_20261121.py,quality_audit.py,live_e2e18_full.py,two_lane_alert_preview.py,live_regulated_sidecar.py} "$RUNNER_TEMP/aml339/"
          cd "$RUNNER_TEMP/aml339"
          python3 repair_sources_20261121.py
          python3 quality_audit.py --self-test
      - name: Official ATS full listing and role details
        shell: bash
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aml339"
          python3 live_regulated_sidecar.py --source "$SOURCE" --minutes 4 --out "candidate_${SOURCE}.json"
      - name: Retain source-level evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aml339-regulated-external-${{ matrix.source }}
          path: ${{ runner.temp }}/aml339/candidate_*.json
          retention-days: 14
          if-no-files-found: warn
  summary:
    needs: [audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: aml339-regulated-external-*
          path: evidence
      - name: Validate all official source and job evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          expect={"emi-trumia-mt","emi-zen-lt"}
          found={}
          for p in Path("evidence").rglob("candidate_*.json"):
              data=json.loads(p.read_text(encoding="utf-8"))
              if data["source_registry"]!="regulated_emi_sidecar_v1":
                  raise ValueError("Incorrect regulated source registry")
              if data["original_catalog_sources"]!=339 or len(data["sources"])!=1:
                  raise ValueError("Pinned catalog mismatch")
              x=data["sources"][0]
              sid=x["source_id"]
              if sid not in expect or sid in found or p.name!=f"candidate_{sid}.json":
                  raise ValueError("Duplicate or wrong source")
              found[sid]={"listed":x["total_listed"],"matched":x["relevant_leads"],
                          "checked":len(x["audited"]),
                          "unverified":x["unverified_in_scope"],
                          "state":x["state"],
                          "complete":x["list_complete"],
                          "errors":x.get("errors",[])}
          print("REGULATED_EMI_OFFICIAL_CANARY",json.dumps(found,ensure_ascii=False),flush=True)
          Path("regulated_emi_canary.json").write_text(json.dumps(found,indent=2)+"\n")
          if set(found)!=expect:raise RuntimeError("Not all source evidence received")
          if any(x["state"]!="listing_extracted" or x["complete"] is not True
                 or x["checked"]!=x["matched"] or x["unverified"] for x in found.values()):
              raise RuntimeError("New source not ready for automatic monitoring")
          PY
      - name: Preserve findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aml339-regulated-emi-canary-summary
          path: regulated_emi_canary.json
          retention-days: 14
          if-no-files-found: warn
