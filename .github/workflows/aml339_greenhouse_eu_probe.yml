name: AML 339 - TrueLayer Greenhouse EU host probe
on:
  push:
    branches: ["experiment/aml339-http-diagnostic-20261121"]
    paths: [".github/workflows/aml339_greenhouse_eu_probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public employer ATS hosts without writing state
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          urls={
            "greenhouse_us":"https://boards-api.greenhouse.io/v1/boards/truelayer/jobs",
            "greenhouse_eu":"https://boards-api.eu.greenhouse.io/v1/boards/truelayer/jobs",
            "public_eu_board":"https://job-boards.eu.greenhouse.io/truelayer",
          }
          for label,url in urls.items():
            result={"label":label,"url":url}
            try:
              req=urllib.request.Request(url,headers={
                "User-Agent":"Mozilla/5.0 (compatible; AMLJobRadar/1.0; public read-only careers search)"})
              with urllib.request.urlopen(req,timeout=15) as response:
                raw=response.read(400000)
                result.update(status=response.status,final_url=response.url,
                  bytes=len(raw),content_type=response.headers.get("Content-Type"))
              if raw.lstrip().startswith(b"{"):
                try:
                  body=json.loads(raw)
                  result["jobs_count"]=len(body.get("jobs",[]))
                  result["titles"]=[j.get("title") for j in body.get("jobs",[])[:5]]
                except ValueError:result["response"]="invalid json"
              else:
                result["has_job_board_markup"]=b"Current openings" in raw or b"job-board" in raw
            except urllib.error.HTTPError as e:
              result.update(status=e.code,error="HTTP "+str(e.code))
            except Exception as e:
              result.update(error=type(e).__name__+": "+str(e)[:200])
            print("TRUELAYER_EU_HOST",json.dumps(result,ensure_ascii=False),flush=True)
          PY
