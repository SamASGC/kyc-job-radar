name: AML339 Peratera UK EMI official Personio full job audit
on:
  push:
    branches: [feat/aml339-growth50-skills-first-20261124]
    paths:
      - .github/workflows/aml339_peratera_canary.yml
      - experiments/aml339/live_peratera_probe.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unpack pinned original audited source parser
        shell: bash
        run: |
          set -euo pipefail
          echo 'e8a08263115c4bbbaf02d4a4ae59431a7e4b16a0a7c79e339ff2f53ef9aadc02  experiments/aml339/full_original_339_sources.zip' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/aml339"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile("experiments/aml339/full_original_339_sources.zip") as z:
              allowed={"amlradar/__init__.py","amlradar/model.py","amlradar/net.py",
                       "amlradar/employer_links.py","amlradar/sources.py","fuentes.json",
                       "VALIDAR_REAL_SIN_TOCAR_DATOS.py"}
              assert set(z.namelist())==allowed and sum(i.file_size for i in z.infolist())<800_000
              assert all(not i.filename.startswith("/") and ".." not in Path(i.filename).parts for i in z.infolist())
              z.extractall(Path(os.environ["RUNNER_TEMP"])/"aml339")
          PY
          cp experiments/aml339/{repair_sources_20261121.py,quality_audit.py,live_e2e18_full.py,two_lane_alert_preview.py,live_peratera_probe.py} "$RUNNER_TEMP/aml339/"
          cd "$RUNNER_TEMP/aml339"
          python3 repair_sources_20261121.py
          python3 quality_audit.py --self-test
      - name: Read official jobs, screening duties, UK and Global remote eligibility conditions
        shell: bash
        run: |
          cd "$RUNNER_TEMP/aml339"
          python3 live_peratera_probe.py
      - name: Preserve complete ATS evidence including failed checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aml339-peratera-official-jobs-canary
          path: ${{ runner.temp }}/aml339/peratera_live_audit.json
          retention-days: 14
          if-no-files-found: warn
