name: v3.15 - VP Bank Umantis listing date and row markup
on:
  push:
    branches: ["fix/v3-15-public-recruitment-portals"]
    paths: [".github/workflows/v3_15_vp_markup.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Check date and vacancy containment on public bank job feed
        run: |
          python - <<'PY'
          import asyncio,json,re
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from job_radar.http import Http
          URL="https://recruitingapp-2813.umantis.com/Jobs/All?CompanyID=All&Reset=G&lang=eng"
          async def main():
            h=Http(concurrency=2,timeout=20)
            try:
              r=await h.get(URL);soup=BeautifulSoup(r.text,"html.parser")
              links=[a for a in soup.select('a[href]') if "/Vacancies/" in a["href"] and "/Description/" in a["href"]]
              print("VP_COUNT",len(links))
              for a in links[:5]:
                p=a
                traces=[]
                for level in range(1,6):
                  p=p.parent
                  if not p:break
                  traces.append({"level":level,"tag":p.name,"class":p.get("class"),"text":p.get_text(" ",strip=True)[:340],"html":str(p)[:450]})
                print("VP_ROW",json.dumps({"title":a.get_text(" ",strip=True),
                   "href":urljoin(str(r.url),a["href"]),"parents":traces},ensure_ascii=False),flush=True)
            finally:await h.close()
          asyncio.run(main())
          PY
