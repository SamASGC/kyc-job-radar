concurrency: 28
timeout_seconds: 20
company_timeout_seconds: 240

aggregators:
  jobicy: true
  remotive: true
  arbeitnow: true
  remoteok: true
  himalayas: true
  weworkremotely: true

# Respect source update cadence / fair-use while the overall radar still runs hourly.
aggregator_cadence_hours:
  Jobicy: 1
  Arbeitnow: 1
  We Work Remotely: 1
  Remote OK: 2
  Remotive: 6
  Himalayas: 24


# Long-tail discovery: :17 and :47 scan disjoint ~180-firm batches; 2x180
# covers every company with an available HTTPS site within an hour.
# The other 2255 directory entries have no usable URL and are NOT scanned.
directory_cold_per_hour: 180
directory_hot_per_hour: 250
directory_domain_queries_per_hour: 80

# Public job-board links are untrusted leads; they must resolve to ATS feeds.
bridge_new_ats_per_hour: 40
bridge_hot_per_hour: 200
bridge_aggregator_pages_per_hour: 24
