# No PII is stored here. This is a scoring profile distilled from the CV.
minimum_score: 62
# Prefer <=7 days; keep up to 14 days to increase coverage without filling the radar with stale roles.
max_post_age_days: 14
stale_after_hours: 72

# Onsite/hybrid: ONLY these countries. Barcelona is explicitly in scope as part of Spain.
onsite_hybrid_countries:
  - Spain
  - Luxembourg
  - Switzerland
  - Estonia
  - Czechia
  - Malta

# Remote: Europe only. Europe/EMEA/global postings remain eligible when a European candidate is allowed,
# but country-locked remote jobs outside Europe (US, Mexico, Canada, LATAM, etc.) are rejected.
remote_scope: Europe

profile_summary:
  years_relevant: 3
  current_domain: "Corporate KYC/KYB/CDD in regulated payments"
  seniority: "Senior Analyst / Lead SME"
  languages:
    Spanish: Native
    English: Professional working proficiency
    French: Advanced

current_strengths:
  - Corporate KYC/KYB
  - Customer Due Diligence (CDD)
  - Merchant / seller onboarding
  - Lifecycle and periodic review
  - High-risk CDD / EDD
  - UBO / beneficial ownership verification
  - Complex ownership structures
  - Corporate documentation
  - PEP / sanctions / adverse-media output review
  - Financial-crime red flags
  - Risk-based assessment
  - Escalations and audit-ready documentation
  - SOP / SLA-driven operations
  - Quality review and analyst support
  - Regulated payments

# Explicitly NOT claimed as hands-on experience. If a vacancy makes these a must-have,
# the fit score must be materially penalised instead of treating them only as "skills to buy".
hands_on_gaps:
  - Transaction Monitoring
  - AML investigations
  - SAR/STR drafting
  - Regulatory reporting
  - Sanctions investigations
  - Source of Funds (SoF)
  - Source of Wealth (SoW)

# Transferable KYC/KYB experience is not the same as hands-on local-framework knowledge.
jurisdiction_gaps:
  - Maltese AML/CFT / PMLFTR / FIAU

priority_growth_skills:
  - Transaction Monitoring
  - SAR/STR drafting
  - AML investigations
  - Customer Risk Rating
  - Merchant Risk
  - Payment investigations
  - Sanctions investigations
  - Regulatory reporting
  - Source of Funds (SoF)
  - Source of Wealth (SoW)
