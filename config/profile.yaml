# No PII is stored here. This is a scoring profile distilled from the CV.
minimum_score: 62
# Strict v2: original posting <=96h; missing or unreliable dates are never alerted.
max_post_age_days: 4
max_post_age_hours: 96
strict_quality_gate: true
# User preference: technical individual-contributor KYC/AML and Financial Crime work only.
# Manager, Head, MLRO, Director and explicit staff supervision roles are not alerts.
exclude_management_roles: true
stale_after_hours: 24

# Onsite/hybrid shortlist only. Barcelona is excluded in v2.
onsite_hybrid_countries:
  - Spain
  - Luxembourg
  - Switzerland
  - Estonia
  - Lithuania

# Remote must explicitly include Spain/Canary Islands in a structured ATS location.
# Europe/EMEA/Global alone does NOT establish permission to work from Canarias.
remote_scope: Spain

profile_summary:
  years_relevant: 3
  current_domain: "Corporate KYC/KYB/CDD in regulated payments"
  seniority: "Senior Analyst / Lead SME"
  languages:
    Spanish: Native
    English: Professional working proficiency
    French: Advanced

current_strengths:
  - Corporate KYC/KYB
  - Customer Due Diligence (CDD)
  - Merchant / seller onboarding
  - Lifecycle and periodic review
  - High-risk CDD / EDD
  - UBO / beneficial ownership verification
  - Complex ownership structures
  - Corporate documentation
  - PEP / sanctions / adverse-media output review
  - Financial-crime red flags
  - Risk-based assessment
  - Escalations and audit-ready documentation
  - SOP / SLA-driven operations
  - Quality review and analyst support
  - Regulated payments

# Explicitly NOT claimed as hands-on experience. If a vacancy makes these a must-have,
# the fit score must be materially penalised instead of treating them only as "skills to buy".
hands_on_gaps:
  - Transaction Monitoring
  - AML investigations
  - SAR/STR drafting
  - Regulatory reporting
  - Sanctions investigations
  - Source of Funds (SoF)
  - Source of Wealth (SoW)

# Transferable KYC/KYB experience is not the same as hands-on local-framework knowledge.
jurisdiction_gaps:
  - Maltese AML/CFT / PMLFTR / FIAU
  # Corporate payments KYB is NOT hands-on AML/KYC in Luxembourg fund administration.
  - Luxembourg funds AML/KYC

priority_growth_skills:
  - Transaction Monitoring
  - SAR/STR drafting
  - AML investigations
  - Customer Risk Rating
  - Merchant Risk
  - Payment investigations
  - Sanctions investigations
  - Regulatory reporting
  - Source of Funds (SoF)
  - Source of Wealth (SoW)
